<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <title>Control de Horarios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-soft: #eef2ff;
      --primary-mid: #c7d2fe;
      --primary-glow: rgba(79,70,229,0.28);
      --accent: #06b6d4;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --surface-3: #f1f5f9;
      --border: #e2e8f0;
      --border-soft: #f1f5f9;
      --text: #0f172a;
      --text-2: #475569;
      --text-3: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 14px;
      --radius-sm: 10px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --shadow-sm: 0 1px 3px rgba(15,23,42,0.04), 0 1px 2px rgba(15,23,42,0.03);
      --shadow: 0 4px 16px rgba(15,23,42,0.06), 0 1px 3px rgba(15,23,42,0.04);
      --shadow-md: 0 8px 24px rgba(15,23,42,0.08), 0 2px 6px rgba(15,23,42,0.04);
      --shadow-lg: 0 16px 48px rgba(15,23,42,0.12), 0 4px 12px rgba(15,23,42,0.06);
      --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
      --font: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    html, body {
      height: 100%;
      font-family: var(--font);
      background: var(--app-bg, linear-gradient(160deg, #f1f5f9 0%, #eef2ff 50%, #f0f9ff 100%));
      background-attachment: fixed;
      color: var(--text);
      font-size: var(--app-fs, 15px);
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-x pan-y;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #root { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

    /* ===== TOPBAR ===== */
    .topbar {
      display: flex; align-items: center; gap: 14px;
      padding: 0 20px; height: 60px;
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border-bottom: 1px solid rgba(226,232,240,0.8);
      flex-shrink: 0; z-index: 40;
      box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset;
    }
    .topbar-title {
      font-size: 18px; font-weight: 800; color: var(--text);
      cursor: pointer; letter-spacing: -0.03em;
      background: linear-gradient(135deg, #0f172a 0%, #4f46e5 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      transition: opacity var(--transition);
    }
    .topbar-title:hover { opacity: 0.8; }
    .topbar-week {
      background: linear-gradient(135deg, #f8fafc, #f1f5f9);
      border: 1px solid var(--border);
      border-radius: 999px; padding: 7px 16px;
      font-size: 13px; color: var(--text-2); font-weight: 650;
      box-shadow: var(--shadow-sm);
      letter-spacing: -0.01em;
    }
    .topbar-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 18px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text-2); font-size: 13px; font-weight: 600;
      cursor: pointer; min-height: 40px;
      transition: all var(--transition);
      box-shadow: var(--shadow-sm);
      letter-spacing: -0.01em;
    }
    .btn:hover {
      background: var(--surface-2); border-color: #cbd5e1;
      transform: translateY(-1.5px); box-shadow: var(--shadow);
    }
    .btn:active { transform: translateY(0); box-shadow: var(--shadow-sm); }
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      color: #fff; border-color: transparent;
      box-shadow: 0 4px 14px var(--primary-glow), 0 1px 3px rgba(79,70,229,0.2);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #4338ca 0%, #4f46e5 100%);
      border-color: transparent; box-shadow: 0 6px 20px var(--primary-glow);
    }
    .btn-danger { color: var(--danger); border-color: #fecaca; background: #fff; }
    .btn-danger:hover { background: #fef2f2; border-color: #fca5a5; }
    .btn-week {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text-2); padding: 0; border-radius: 12px;
      cursor: pointer; font-size: 16px; width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--transition); box-shadow: var(--shadow-sm);
    }
    .btn-week:hover {
      background: var(--primary-soft); border-color: var(--primary-mid);
      color: var(--primary); transform: scale(1.05);
    }
    .menu-btn {
      background: var(--surface-2); border: 1px solid var(--border); cursor: pointer; font-size: 18px;
      width: 40px; height: 40px; color: var(--text-2);
      display: flex; align-items: center; justify-content: center;
      border-radius: 12px; transition: all var(--transition);
      box-shadow: var(--shadow-sm);
    }
    .menu-btn:hover { background: var(--primary-soft); border-color: var(--primary-mid); color: var(--primary); }

    /* ===== LAYOUT ===== */
    .body { display: flex; flex: 1; min-height: 0; position: relative; }

    /* ===== SIDEBAR ===== */
    .sidebar {
      position: fixed; top: 60px; left: 0; bottom: 56px; width: 280px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-right: 1px solid rgba(226,232,240,0.9);
      display: flex; flex-direction: column; overflow-y: auto; z-index: 50;
      transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
      box-shadow: var(--shadow-lg);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-backdrop {
      display: none; position: fixed; inset: 0; top: 60px;
      background: rgba(15,23,42,0.4); z-index: 49;
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      animation: fadeIn 0.2s ease;
    }
    .sidebar-backdrop.open { display: block; }
    .sidebar-section {
      padding: 20px 20px 10px; font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-3);
    }
    .dept-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px; margin: 3px 12px; cursor: pointer;
      border-radius: var(--radius); border: 1.5px solid transparent;
      min-height: 58px; transition: all var(--transition);
    }
    .dept-item:hover { background: var(--surface-3); border-color: transparent; }
    .dept-item.active {
      background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
      border-color: var(--primary-mid);
      box-shadow: 0 2px 12px rgba(79,70,229,0.1);
    }
    .dept-icon {
      font-size: 20px; flex-shrink: 0; width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(145deg, #f8fafc, #f1f5f9);
      border-radius: 12px; border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .dept-item.active .dept-icon {
      background: linear-gradient(145deg, #e0e7ff, #c7d2fe);
      border-color: var(--primary-mid);
    }
    .dept-info { flex: 1; min-width: 0; }
    .dept-name { font-size: 14px; font-weight: 700; letter-spacing: -0.02em; }
    .dept-item.active .dept-name { color: var(--primary); }
    .dept-sub { font-size: 11.5px; color: var(--text-3); margin-top: 2px; font-weight: 500; }
    .sidebar-divider { margin: 12px 20px; border: none; border-top: 1px solid var(--border-soft); }
    .add-dept-btn {
      margin: 6px 14px 10px; padding: 12px; border: 1.5px dashed #cbd5e1;
      border-radius: var(--radius); background: transparent; color: var(--text-3);
      font-size: 13px; font-weight: 650; cursor: pointer; width: calc(100% - 28px);
      min-height: 44px; transition: all var(--transition);
    }
    .add-dept-btn:hover {
      border-color: var(--primary); color: var(--primary);
      background: var(--primary-soft); border-style: solid;
    }

    /* ===== MAIN ===== */
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }

    /* ===== TOOLBAR ===== */
    .toolbar {
      display: flex; flex-direction: column; align-items: stretch; gap: 12px;
      padding: 14px 18px; background: rgba(255,255,255,0.7);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(226,232,240,0.8); flex-shrink: 0;
    }
    .day-tabs {
      display: flex; background: var(--surface-3); border-radius: var(--radius);
      padding: 4px; gap: 3px; overflow-x: auto;
      box-shadow: inset 0 1px 3px rgba(15,23,42,0.04);
    }
    .day-tab {
      padding: 10px 14px; border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 650; color: var(--text-2);
      cursor: pointer; border: none; background: none; white-space: nowrap;
      min-height: 42px; flex: 1; transition: all var(--transition);
      letter-spacing: -0.01em;
    }
    .day-tab:hover { color: var(--text); background: rgba(255,255,255,0.7); }
    .day-tab.active {
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      color: #fff;
      box-shadow: 0 3px 12px var(--primary-glow), 0 1px 3px rgba(79,70,229,0.2);
    }
    .stats-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .stats-row::-webkit-scrollbar { display: none; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 16px; text-align: center;
      min-width: 78px; flex-shrink: 0; cursor: pointer; min-height: 60px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: all var(--transition); box-shadow: var(--shadow-sm);
    }
    .stat-card:hover {
      border-color: var(--primary-mid); transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .stat-val { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
    .stat-lbl {
      font-size: 10px; color: var(--text-3); margin-top: 4px;
      font-weight: 650; text-transform: uppercase; letter-spacing: 0.04em;
    }

    /* ===== TABLE ===== */
    .table-wrap {
      flex: 1; overflow: auto; padding: 16px;
      min-height: 0; -webkit-overflow-scrolling: touch;
    }
    .shift-header th { text-align: center; padding: 9px 6px; font-size: 12px; font-weight: 700; letter-spacing: -0.01em; }
    .hour-header th { text-align: center; padding: 6px 2px; font-size: 11px; font-weight: 650; }
    table {
      border-collapse: separate; border-spacing: 0; min-width: max-content;
      border-radius: var(--radius-lg); overflow: hidden;
      box-shadow: var(--shadow); border: 1px solid var(--border);
      background: var(--surface);
    }
    .name-td {
      position: sticky; left: 0; background: var(--surface);
      border-right: 2px solid var(--border); padding: 0 18px;
      font-size: 13.5px; font-weight: 650; white-space: nowrap; min-width: 155px;
      cursor: pointer; transition: background var(--transition);
      letter-spacing: -0.01em;
    }
    .name-td:hover { background: var(--primary-soft); }
    .cell {
      width: 46px; min-width: 46px; height: 46px; cursor: pointer;
      border: 1px solid transparent; transition: all 0.15s;
    }
    .cell:hover { filter: brightness(0.96); transform: scale(0.96); }
    .cell-inner {
      width: 100%; height: 100%; display: flex; align-items: center;
      justify-content: center; font-size: 15px; font-weight: 700;
    }
    .cell-empty { color: #e2e8f0; }
    .emp-row td { border-bottom: 1px solid var(--border-soft); }
    .emp-row:last-child td { border-bottom: none; }
    .emp-row:hover .name-td { background: var(--primary-soft); }

    /* ===== INLINE PANEL ===== */
    .inline-panel {
      flex-shrink: 0; background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border); padding: 14px 18px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 68px;
      box-shadow: 0 -6px 24px rgba(15,23,42,0.05);
    }

    /* ===== BOTTOM BAR ===== */
    .bottom-bar {
      display: flex; align-items: center; padding: 12px 18px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border); flex-shrink: 0;
    }

    /* ===== MODALS ===== */
    .overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,0.5);
      display: flex; align-items: flex-end; justify-content: center; z-index: 100;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      animation: fadeIn 0.22s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp {
      from { transform: translateY(32px) scale(0.98); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    .modal {
      background: var(--surface); border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      padding: 28px; width: 100%; max-width: 600px; max-height: 88vh; overflow-y: auto;
      box-shadow: var(--shadow-lg); animation: slideUp 0.28s cubic-bezier(0.4,0,0.2,1);
    }
    .modal-title {
      font-size: 20px; font-weight: 800; margin-bottom: 20px;
      letter-spacing: -0.03em; color: var(--text);
    }
    .modal-footer {
      display: flex; gap: 10px; justify-content: flex-end;
      margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border-soft);
    }
    .form-label {
      display: block; font-size: 12px; font-weight: 700; color: var(--text-2);
      margin-bottom: 7px; margin-top: 18px; letter-spacing: 0.02em;
    }
    .form-input {
      width: 100%; padding: 12px 16px; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); font-size: 15px; outline: none; min-height: 48px;
      background: var(--surface); transition: all var(--transition);
      font-family: var(--font); color: var(--text);
    }
    .form-input:focus {
      border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow);
    }
    .form-input::placeholder { color: var(--text-3); }
    .color-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .color-swatch {
      width: 36px; height: 36px; border-radius: 12px; cursor: pointer;
      border: 3px solid transparent; transition: all var(--transition);
      box-shadow: var(--shadow-sm);
    }
    .color-swatch:hover { transform: scale(1.12); }
    .color-swatch.sel {
      border-color: var(--text); box-shadow: 0 0 0 2px #fff inset, var(--shadow);
      transform: scale(1.08);
    }
    .emoji-group { margin-bottom: 14px; }
    .emoji-group-label {
      font-size: 11px; font-weight: 700; color: var(--text-3);
      margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.08em;
    }
    .emoji-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .emoji-opt {
      width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
      font-size: 22px; border-radius: 12px; cursor: pointer; border: 2px solid transparent;
      background: var(--surface-2); transition: all var(--transition);
    }
    .emoji-opt:hover { background: var(--surface-3); transform: scale(1.08); }
    .emoji-opt.sel {
      border-color: var(--primary); background: var(--primary-soft);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .slot-counter {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface-2); border-radius: var(--radius);
      padding: 8px 14px; border: 1px solid var(--border);
    }
    .counter-btn {
      width: 36px; height: 36px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--surface);
      cursor: pointer; font-size: 18px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--transition); box-shadow: var(--shadow-sm);
    }
    .counter-btn:hover {
      background: var(--primary-soft); border-color: var(--primary-mid); color: var(--primary);
    }

    /* ===== SEGMENTED CONTROL (reusable) ===== */
    .segmented {
      display: inline-flex; background: var(--surface-3); border-radius: var(--radius);
      padding: 3px; gap: 2px; border: 1px solid var(--border);
    }
    .segmented-btn {
      border: none; background: none; cursor: pointer; padding: 7px 13px;
      border-radius: 8px; font-size: 12px; font-weight: 650; color: var(--text-2);
      display: flex; align-items: center; gap: 6px; transition: all var(--transition);
      white-space: nowrap;
    }
    .segmented-btn:hover { color: var(--text); }
    .segmented-btn.active {
      background: var(--surface); color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    /* ===== LEGEND ===== */
    .legend {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      padding: 8px 4px 2px;
    }
    .legend-title {
      font-size: 10px; font-weight: 700; color: var(--text-3);
      text-transform: uppercase; letter-spacing: 0.08em; margin-right: 2px;
    }
    .legend-chip {
      display: flex; align-items: center; gap: 6px; font-size: 11.5px;
      font-weight: 600; color: var(--text-2); white-space: nowrap;
    }
    .legend-swatch {
      width: 15px; height: 15px; border-radius: 5px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 9px;
      border: 1px solid rgba(15,23,42,0.06);
    }

    /* ===== DAY CONFIG ROW ===== */
    .day-config {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 2px 2px 0;
    }
    .day-config-label {
      font-size: 11px; color: var(--text-3); font-weight: 650; white-space: nowrap;
    }
    .range-pill {
      display: flex; align-items: center; gap: 6px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 999px; padding: 5px 10px 5px 12px;
      box-shadow: var(--shadow-sm);
    }
    .range-pill select {
      border: none; background: none; font-size: 12px; font-weight: 700;
      color: var(--text); cursor: pointer; font-family: var(--font);
    }

    /* ===== DROPDOWN MENU ===== */
    .dropdown { position: relative; }
    .dropdown-menu {
      position: absolute; top: calc(100% + 8px); left: 0; min-width: 210px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow-lg);
      padding: 6px; z-index: 60; animation: fadeIn 0.15s ease;
    }
    .dropdown-menu.right { left: auto; right: 0; }
    .dropdown-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 10px 12px; border: none; background: none; border-radius: 10px;
      font-size: 13px; font-weight: 600; color: var(--text-2); cursor: pointer;
      text-align: left; transition: all var(--transition); min-height: 40px;
    }
    .dropdown-item:hover { background: var(--surface-3); color: var(--text); }
    .dropdown-item .ic { font-size: 16px; width: 20px; text-align: center; }
    .dropdown-backdrop { position: fixed; inset: 0; z-index: 55; }

    /* ===== TITLE EDIT HINT ===== */
    .title-wrap { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
    .title-pencil {
      font-size: 12px; opacity: 0; transition: opacity var(--transition); -webkit-text-fill-color: initial;
    }
    .title-wrap:hover .title-pencil { opacity: 0.55; }

    /* ===== NUMBER PICKER (calculadora) ===== */
    .numpad-display {
      display: flex; align-items: baseline; justify-content: center; gap: 6px;
      background: var(--surface-3); border: 1.5px solid var(--border); border-radius: var(--radius);
      padding: 16px 12px; margin-bottom: 12px;
    }
    .numpad-display-val { font-size: 40px; font-weight: 800; color: var(--text); letter-spacing: -0.02em; line-height: 1; min-width: 1ch; }
    .numpad-display-val.placeholder { color: var(--text-3); }
    .numpad-display-unit { font-size: 13px; color: var(--text-3); font-weight: 650; }
    .numgrid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin: 0 0 10px; }
    .numgrid-btn {
      aspect-ratio: 1.35; border-radius: 12px; border: 1.5px solid var(--border);
      background: var(--surface); font-size: 20px; font-weight: 750; color: var(--text);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all var(--transition); box-shadow: var(--shadow-sm); font-family: var(--font);
    }
    .numgrid-btn:hover:not(:disabled) { border-color: var(--primary-mid); background: var(--primary-soft); transform: translateY(-1px); box-shadow: var(--shadow); }
    .numgrid-btn:active:not(:disabled) { transform: translateY(0); }
    .numgrid-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .numgrid-btn.fn { background: var(--surface-3); color: var(--text-2); font-size: 15px; font-weight: 700; }
    .numgrid-btn.fn.clear { color: var(--danger); }
    .numcount-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0; background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px;
      padding: 4px 14px; cursor: pointer; transition: all var(--transition); min-width: 54px;
      box-shadow: var(--shadow-sm);
    }
    .numcount-btn:hover { border-color: var(--primary-mid); background: var(--primary-soft); }

    /* ===== TEMPLATES MODAL ===== */
    .tpl-row {
      display: flex; align-items: center; gap: 8px; padding: 10px 12px;
      border: 1.5px solid var(--border); border-radius: var(--radius);
      margin-bottom: 9px; background: var(--surface-2); flex-wrap: wrap;
    }
    .tpl-row.filled { background: var(--surface); border-color: var(--primary-mid); }
    .tpl-name-input {
      flex: 1 1 120px; min-width: 90px; border: none; background: transparent;
      font-size: 13.5px; font-weight: 700; color: var(--text); padding: 5px 4px;
      border-bottom: 1.5px dashed transparent; font-family: var(--font);
    }
    .tpl-name-input:focus { outline: none; border-bottom-color: var(--primary); }
    .tpl-meta { font-size: 10.5px; color: var(--text-3); white-space: nowrap; font-weight: 600; }
    .week-check-row {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px;
      border-radius: 9px; cursor: pointer; transition: background var(--transition);
    }
    .week-check-row:hover { background: var(--surface-3); }
    .week-check-row.current { background: var(--primary-soft); }
    .week-check-row input { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      padding: 48px 20px; color: var(--text-3);
    }
    .empty-state .es-icon { font-size: 30px; }
    .empty-state .es-text { font-size: 13.5px; font-weight: 550; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1; border-radius: 99px; border: 2px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; background-clip: content-box; }

    /* ===== TOAST ===== */
    .toast-wrap {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      z-index: 200; display: flex; flex-direction: column; gap: 8px;
      pointer-events: none; max-width: 90vw;
    }
    .toast {
      pointer-events: auto; background: #0f172a; color: #f8fafc;
      padding: 12px 18px; border-radius: 12px; font-size: 13px; font-weight: 600;
      box-shadow: 0 12px 40px rgba(15,23,42,0.35); display: flex; align-items: center; gap: 10px;
      animation: toastIn 0.28s cubic-bezier(0.4,0,0.2,1);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .toast.success { background: #065f46; }
    .toast.error { background: #991b1b; }
    .toast.info { background: #1e3a8a; }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .search-emp {
      width: 100%; padding: 8px 12px; border: 1.5px solid var(--border);
      border-radius: 10px; font-size: 13px; outline: none; margin: 0 12px 8px;
      width: calc(100% - 24px); background: var(--surface); font-family: var(--font);
    }
    .search-emp:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
    .week-hours-badge {
      font-size: 10px; font-weight: 700; color: var(--text-3);
      background: var(--surface-3); border-radius: 99px; padding: 1px 6px; margin-left: 4px;
    }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback} = React;

const COLORS = ["#F59E0B","#EF4444","#8B5CF6","#10B981","#3B82F6","#F97316","#EC4899","#6B7280","#14B8A6","#6366F1"];
const EMOJI_GROUPS = [
  {label:"Cocina",    emojis:["🍳","🍕","🍔","🥗","🥘","🍲","🥩","🍱"]},
  {label:"Panadería", emojis:["🍞","🥖","🥐","🫓","🥨","🧇","🥞","🎂","🍰","🧁","🍩","🍪"]},
  {label:"Bar",       emojis:["🍹","🍻","🥂","🍷","🧃","☕","🧋"]},
  {label:"Sala",      emojis:["🪑","🍽️","🥄","🍴","🛎️"]},
  {label:"General",   emojis:["🧹","📦","🔧","🎯","⭐","🏠","❄️","🔥"]},
];
const INITIAL_DEPTS = [
  {id:"dependientas",label:"Dependientas",icon:"🛎️",color:"#EC4899"},
  {id:"cocina",      label:"Cocina",       icon:"🍳",color:"#F59E0B"},
  {id:"panaderia",   label:"Panadería",    icon:"🥖",color:"#A0622A"},
  {id:"pasteleria",  label:"Pastelería",   icon:"🎂",color:"#8B5CF6"},
  {id:"bolleria",    label:"Bollería",     icon:"🥐",color:"#F97316"},
  {id:"limpieza",    label:"Limpieza",     icon:"🧹",color:"#10B981"},
];
const DEFAULT_SLOTS = [
  {l:"00:00",s:"morning"},{l:"01:00",s:"morning"},{l:"02:00",s:"morning"},{l:"03:00",s:"morning"},{l:"04:00",s:"morning"},{l:"05:00",s:"morning"},
  {l:"06:00",s:"lunch"},{l:"07:00",s:"lunch"},{l:"08:00",s:"lunch"},{l:"09:00",s:"lunch"},{l:"10:00",s:"lunch"},{l:"11:00",s:"lunch"},{l:"12:00",s:"lunch"},
  {l:"13:00",s:"afternoon"},{l:"14:00",s:"afternoon"},{l:"15:00",s:"afternoon"},{l:"16:00",s:"afternoon"},{l:"17:00",s:"afternoon"},{l:"18:00",s:"afternoon"},
  {l:"19:00",s:"dinner"},{l:"20:00",s:"dinner"},{l:"21:00",s:"dinner"},{l:"22:00",s:"dinner"},{l:"23:00",s:"dinner"},{l:"24:00",s:"dinner"},
];
const SLOTS_30 = [
  {l:"00:00",s:"morning"},{l:"00:30",s:"morning"},{l:"01:00",s:"morning"},{l:"01:30",s:"morning"},{l:"02:00",s:"morning"},{l:"02:30",s:"morning"},
  {l:"03:00",s:"morning"},{l:"03:30",s:"morning"},{l:"04:00",s:"morning"},{l:"04:30",s:"morning"},{l:"05:00",s:"morning"},{l:"05:30",s:"morning"},
  {l:"06:00",s:"lunch"},{l:"06:30",s:"lunch"},{l:"07:00",s:"lunch"},{l:"07:30",s:"lunch"},{l:"08:00",s:"lunch"},{l:"08:30",s:"lunch"},{l:"09:00",s:"lunch"},{l:"09:30",s:"lunch"},
  {l:"10:00",s:"lunch"},{l:"10:30",s:"lunch"},{l:"11:00",s:"lunch"},{l:"11:30",s:"lunch"},{l:"12:00",s:"lunch"},{l:"12:30",s:"lunch"},
  {l:"13:00",s:"afternoon"},{l:"13:30",s:"afternoon"},{l:"14:00",s:"afternoon"},{l:"14:30",s:"afternoon"},{l:"15:00",s:"afternoon"},{l:"15:30",s:"afternoon"},
  {l:"16:00",s:"afternoon"},{l:"16:30",s:"afternoon"},{l:"17:00",s:"afternoon"},{l:"17:30",s:"afternoon"},{l:"18:00",s:"afternoon"},{l:"18:30",s:"afternoon"},
  {l:"19:00",s:"dinner"},{l:"19:30",s:"dinner"},{l:"20:00",s:"dinner"},{l:"20:30",s:"dinner"},{l:"21:00",s:"dinner"},{l:"21:30",s:"dinner"},
  {l:"22:00",s:"dinner"},{l:"22:30",s:"dinner"},{l:"23:00",s:"dinner"},{l:"23:30",s:"dinner"},{l:"24:00",s:"dinner"},{l:"24:30",s:"dinner"},
];
const SHIFT_META = {
  morning:  {label:"Mañana",  color:"#F59E0B",bg:"#FEF9EC",text:"#92400E"},
  lunch:    {label:"Almuerzo",color:"#3B82F6",bg:"#EFF6FF",text:"#1E3A8A"},
  afternoon:{label:"Comida",  color:"#10B981",bg:"#F0FDF4",text:"#064E3B"},
  dinner:   {label:"Cenas",   color:"#8B5CF6",bg:"#F5F3FF",text:"#4C1D95"},
};
const DAYS_S = ["Lun","Mar","Mie","Jue","Vie","Sab","Dom"];
const DAYS_F = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const MONTHS = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

function wk(n){return "w"+n;}
function countH(ws,dsMap){
  if(!ws)return 0;
  let h=0;
  Object.entries(ws).forEach(([di,day])=>{
    if(!day)return;
    const size=(dsMap&&(dsMap[Number(di)]==="30m"||dsMap[di]==="30m"))?0.5:1;
    Object.values(day).forEach(v=>{if(v&&v.startsWith("TIT:"))h+=size;});
  });
  return h;
}
function getMonday(off){
  const t=new Date(),d=t.getDay(),diff=d===0?-6:1-d;
  const m=new Date(t);m.setDate(t.getDate()+diff+off*7);return m;
}
function fmtDate(d){return d.getDate()+" "+MONTHS[d.getMonth()];}
function dayDate(mon,i){const d=new Date(mon);d.setDate(mon.getDate()+i);return fmtDate(d);}
function hex2rgba(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return "rgba("+r+","+g+","+b+","+a+")";}
function ls(key,def){try{const v=localStorage.getItem(key);return v!=null?JSON.parse(v):def;}catch(e){return def;}}
function lsSet(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}}


// --- Toast ---
function ToastHost({toasts, onDismiss}){
  if(!toasts||!toasts.length) return null;
  return (
    <div className="toast-wrap">
      {toasts.map(t=>(
        <div key={t.id} className={"toast "+(t.type||"info")} onClick={()=>onDismiss(t.id)}>
          <span>{t.type==="success"?"✓":t.type==="error"?"✕":"ℹ"}</span>
          <span>{t.msg}</span>
        </div>
      ))}
    </div>
  );
}

// --- ConfirmModal ---
function ConfirmModal({title,message,warning,danger,onConfirm,onClose}){
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:400}}>
        <div className="modal-title">{title}</div>
        <p style={{color:"#475569",marginBottom:8}}>{message}</p>
        {warning&&<p style={{color:danger?"#ef4444":"#f59e0b",fontSize:12,background:danger?"#fef2f2":"#fefce8",padding:"8px 12px",borderRadius:8}}>{warning}</p>}
        <div className="modal-footer">
          <button className="btn" onClick={onClose}>Cancelar</button>
          <button className={"btn "+(danger?"btn-danger":"btn-primary")} onClick={()=>{onConfirm();onClose();}}>Confirmar</button>
        </div>
      </div>
    </div>
  );
}

// --- AddEmpModal ---
function AddEmpModal({dept,onClose,onAdd}){
  const [name,setName]=useState("");
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:380}}>
        <div className="modal-title">Añadir empleado</div>
        <label className="form-label">Nombre</label>
        <input className="form-input" value={name} onChange={e=>setName(e.target.value)} placeholder="Nombre del empleado" autoFocus
          onKeyDown={e=>{if(e.key==="Enter"&&name.trim()){onAdd(name.trim());}}}/>
        <div className="modal-footer">
          <button className="btn" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" disabled={!name.trim()} onClick={()=>{if(name.trim())onAdd(name.trim());}}>Añadir</button>
        </div>
      </div>
    </div>
  );
}

// --- DeptFormModal ---
function DeptFormModal({dept,onClose,onSave,isNew,emps,onAddEmp,onDelEmp,onRenEmp}){
  const [label,setLabel]=useState(dept?dept.label:"");
  const [icon,setIcon]=useState(dept?dept.icon:"🍳");
  const [color,setColor]=useState(dept?dept.color:COLORS[4]);
  const [newEmp,setNewEmp]=useState("");
  const [editId,setEditId]=useState(null);
  const [editName,setEditName]=useState("");
  const [delConfirm,setDelConfirm]=useState(null);
  const deptEmps=(emps||[]).filter(e=>e.dept===(dept?dept.id:""));
  const groups=isNew?EMOJI_GROUPS:(()=>{
    const l=(label||"").toLowerCase();
    if(l.includes("cocin")||l.includes("kitchen"))return [EMOJI_GROUPS[0]];
    if(l.includes("pan")||l.includes("past")||l.includes("boll"))return [EMOJI_GROUPS[1]];
    if(l.includes("bar"))return [EMOJI_GROUPS[2]];
    if(l.includes("sala")||l.includes("dep"))return [EMOJI_GROUPS[3]];
    if(l.includes("limp")||l.includes("gen"))return [EMOJI_GROUPS[4]];
    return EMOJI_GROUPS;
  })();
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:460}}>
        <div className="modal-title">{isNew?"Nuevo departamento":"Editar departamento"}</div>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16,padding:12,background:"#f8fafc",borderRadius:10,border:"1px solid #e2e8f0"}}>
          <div style={{width:48,height:48,borderRadius:10,background:hex2rgba(color,0.15),border:"2px solid "+hex2rgba(color,0.4),display:"flex",alignItems:"center",justifyContent:"center",fontSize:26}}>{icon}</div>
          <div><div style={{fontWeight:600,fontSize:15}}>{label||"Nombre"}</div><div style={{fontSize:12,color:"#94a3b8"}}>Vista previa</div></div>
        </div>
        <label className="form-label">Nombre</label>
        <input className="form-input" value={label} onChange={e=>setLabel(e.target.value)} placeholder="ej. Cocina" autoFocus/>
        <label className="form-label">Color</label>
        <div className="color-grid" style={{marginBottom:12}}>
          {COLORS.map(c=><div key={c} className={"color-swatch"+(color===c?" sel":"")} style={{background:c}} onClick={()=>setColor(c)}/>)}
        </div>
        <label className="form-label">Icono</label>
        {groups.map(g=>(
          <div key={g.label} className="emoji-group">
            <div className="emoji-group-label">{g.label}</div>
            <div className="emoji-grid">
              {g.emojis.map(em=><div key={em} className={"emoji-opt"+(icon===em?" sel":"")} onClick={()=>setIcon(em)}>{em}</div>)}
            </div>
          </div>
        ))}
        {!isNew&&(
          <div style={{marginTop:16,borderTop:"1px solid #f1f5f9",paddingTop:14}}>
            <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",color:"#94a3b8",marginBottom:8}}>Empleados</div>
            {deptEmps.length===0&&<div style={{fontSize:12,color:"#cbd5e1",marginBottom:8}}>Sin empleados</div>}
            {deptEmps.map(emp=>(
              <div key={emp.id} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 0",borderBottom:"1px solid #f8fafc"}}>
                {editId===emp.id?(
                  <>
                    <input className="form-input" style={{flex:1,margin:0,padding:"4px 8px",fontSize:13}} value={editName}
                      onChange={e=>setEditName(e.target.value)}
                      onKeyDown={e=>{if(e.key==="Enter"&&editName.trim()){onRenEmp(emp.id,editName.trim());setEditId(null);}}}
                      autoFocus/>
                    <button className="btn btn-primary" style={{padding:"3px 10px",fontSize:12}} onClick={()=>{if(editName.trim()){onRenEmp(emp.id,editName.trim());setEditId(null);}}}>ok</button>
                    <button className="btn" style={{padding:"3px 8px",fontSize:12}} onClick={()=>setEditId(null)}>x</button>
                  </>
                ):(
                  <>
                    <span style={{flex:1,fontSize:13}}>👤 {emp.name}</span>
                    <button style={{background:"none",border:"none",cursor:"pointer",fontSize:13,color:"#94a3b8"}} onClick={()=>{setEditId(emp.id);setEditName(emp.name);}}>✏️</button>
                    <button style={{background:"none",border:"none",cursor:"pointer",fontSize:13,color:"#ef4444"}} onClick={()=>setDelConfirm(emp)}>🗑</button>
                  </>
                )}
              </div>
            ))}
            <div style={{display:"flex",gap:6,marginTop:10}}>
              <input className="form-input" style={{flex:1,margin:0,padding:"5px 10px",fontSize:13}} placeholder="Nuevo empleado..." value={newEmp}
                onChange={e=>setNewEmp(e.target.value)}
                onKeyDown={e=>{if(e.key==="Enter"&&newEmp.trim()){onAddEmp(newEmp.trim());setNewEmp("");}}}/>
              <button className="btn btn-primary" disabled={!newEmp.trim()} onClick={()=>{if(newEmp.trim()){onAddEmp(newEmp.trim());setNewEmp("");}}} style={{fontSize:13,padding:"5px 12px"}}>+ Añadir</button>
            </div>
          </div>
        )}
        <div className="modal-footer">
          <button className="btn" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" disabled={!label.trim()} onClick={()=>{if(label.trim())onSave({label,icon,color});}}>{isNew?"Crear":"Guardar"}</button>
        </div>
      </div>
      {delConfirm&&(
        <div onClick={e=>e.stopPropagation()}>
          <ConfirmModal title="Eliminar empleado" message={"¿Eliminar a "+delConfirm.name+"? Se perderán sus turnos guardados."} warning="Esta acción no se puede deshacer." danger onConfirm={()=>onDelEmp(delConfirm.id)} onClose={()=>setDelConfirm(null)}/>
        </div>
      )}
    </div>
  );
}

// --- SettingsModal ---
function SettingsModal({appFont,appFontSize,appBg,viewMode,onSave,onClose}){
  const [font,setFont]=useState(appFont);
  const [size,setSize]=useState(appFontSize);
  const [bg,setBg]=useState(appBg);
  const [vm,setVm]=useState(viewMode||"pc");
  const FONTS=[{l:"Sistema",v:"system-ui"},{l:"Arial",v:"Arial,sans-serif"},{l:"Georgia",v:"Georgia,serif"},{l:"Mono",v:"monospace"},{l:"Trebuchet",v:"Trebuchet MS,sans-serif"}];
  const BGS=[{l:"Gris",v:"#f8fafc"},{l:"Blanco",v:"#ffffff"},{l:"Crema",v:"#fdf6ec"},{l:"Azul",v:"#eff6ff"},{l:"Verde",v:"#f0fdf4"},{l:"Lavanda",v:"#f5f3ff"},{l:"Rosa",v:"#fff1f2"},{l:"Oscuro",v:"#1e2230"}];
  const VIEWS=[{id:"tablet",label:"📱 Tablet",desc:"Táctil, botones grandes"},{id:"pc",label:"💻 PC",desc:"Escritorio, tamaño estándar"},{id:"web",label:"🌐 Compacto",desc:"Denso, más filas visibles"}];
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:420}}>
        <div className="modal-title">Ajustes de apariencia</div>
        <div style={{background:bg,borderRadius:10,padding:12,border:"1px solid #e2e8f0",marginBottom:14,fontFamily:font,fontSize:size}}>
          <div style={{fontWeight:700,color:"#1e293b"}}>Vista previa del texto</div>
          <div style={{color:"#64748b",marginTop:4}}>Horarios - Lunes - Dependientas</div>
        </div>
        <label className="form-label">Tipografía</label>
        <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}}>
          {FONTS.map(f=>(
            <button key={f.v} onClick={()=>setFont(f.v)} style={{padding:"5px 11px",borderRadius:8,border:"2px solid "+(font===f.v?"#3B82F6":"#e2e8f0"),background:font===f.v?"#eff6ff":"#fff",color:font===f.v?"#2563EB":"#475569",fontFamily:f.v,cursor:"pointer",fontSize:13,fontWeight:font===f.v?700:400}}>{f.l}</button>
          ))}
        </div>
        <label className="form-label">Tamaño: {size}px</label>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
          <button onClick={()=>setSize(s=>Math.max(10,s-1))} style={{width:30,height:30,borderRadius:8,border:"1px solid #e2e8f0",background:"#f8fafc",cursor:"pointer",fontSize:16,fontWeight:700}}>-</button>
          <input type="range" min="10" max="18" value={size} onChange={e=>setSize(Number(e.target.value))} style={{flex:1,accentColor:"#3B82F6"}}/>
          <button onClick={()=>setSize(s=>Math.min(18,s+1))} style={{width:30,height:30,borderRadius:8,border:"1px solid #e2e8f0",background:"#f8fafc",cursor:"pointer",fontSize:16,fontWeight:700}}>+</button>
        </div>
        <label className="form-label">Color de fondo</label>
        <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:10}}>
          {BGS.map(c=>(
            <div key={c.v} onClick={()=>setBg(c.v)} title={c.l} style={{width:34,height:34,borderRadius:8,background:c.v,cursor:"pointer",border:"3px solid "+(bg===c.v?"#3B82F6":"#e2e8f0"),display:"flex",alignItems:"center",justifyContent:"center"}}>
              {bg===c.v&&<span style={{fontSize:13,color:c.v==="#1e2230"?"#fff":"#3B82F6"}}>✓</span>}
            </div>
          ))}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
          <span style={{fontSize:12,color:"#94a3b8"}}>Personalizado:</span>
          <input type="color" value={bg} onChange={e=>setBg(e.target.value)} style={{width:34,height:30,borderRadius:6,border:"1px solid #e2e8f0",cursor:"pointer",padding:2}}/>
          <span style={{fontSize:12,color:"#64748b",fontFamily:"monospace"}}>{bg}</span>
        </div>
        <label className="form-label">Tamaño de la interfaz</label>
        <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:4}}>
          {VIEWS.map(v=>(
            <button key={v.id} onClick={()=>setVm(v.id)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",borderRadius:10,border:"2px solid "+(vm===v.id?"#4f46e5":"#e2e8f0"),background:vm===v.id?"#eef2ff":"#fff",cursor:"pointer",textAlign:"left"}}>
              <span style={{fontSize:13,fontWeight:700,color:vm===v.id?"#4338ca":"#1e293b"}}>{v.label}</span>
              <span style={{fontSize:11,color:"#94a3b8"}}>{v.desc}</span>
            </button>
          ))}
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={()=>{setFont("system-ui");setSize(14);setBg("#f8fafc");setVm("pc");}}>Restablecer</button>
          <button className="btn" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={()=>onSave(font,size,bg,vm)}>Guardar</button>
        </div>
      </div>
    </div>
  );
}

// --- EmpSnapshotModal ---
function EmpSnapshotModal({emp,dept,weekOffset,daySlots,onClose}){
  const wkk=wk(weekOffset);
  const mon=getMonday(weekOffset);
  const ref=useRef(null);
  const [showMonth,setShowMonth]=useState(false);
  const [zoom,setZoom]=useState(1);
  const dsMap=daySlots[wkk]||{};
  const totalH=useMemo(()=>[0,1,2,3,4,5,6].reduce((s,di)=>{
    const size=dsMap[di]==="30m"?0.5:1;
    return s+Object.values((emp.schedules[wkk]||{})[di]||{}).filter(v=>v&&v.startsWith("TIT:")).length*size;
  },0),[emp,wkk,dsMap]);

  const weekLabel=(()=>{const e=new Date(mon);e.setDate(e.getDate()+6);return fmtDate(mon)+" - "+fmtDate(e);})();

  function getSlotsForDay(di){
    return dsMap[di]==="30m"?SLOTS_30:DEFAULT_SLOTS;
  }

  function download(){
    if(!window.html2canvas||!ref.current)return;
    window.html2canvas(ref.current,{scale:2,backgroundColor:"#fff",useCORS:true}).then(canvas=>{
      const a=document.createElement("a");
      a.download=emp.name.replace(/\s+/g,"_")+"_semana.png";
      a.href=canvas.toDataURL("image/png");a.click();
    });
  }

  const monthData=useMemo(()=>{
    try{
      const refDate=getMonday(weekOffset);
      const year=refDate.getFullYear(),month=refDate.getMonth();
      const first=new Date(year,month,1),last=new Date(year,month+1,0);
      const startMon=new Date(first);
      const dow=startMon.getDay();startMon.setDate(startMon.getDate()+(dow===0?-6:1-dow));
      const base=getMonday(0);
      const weeks=[];
      let cur=new Date(startMon);
      while(cur<=last){
        const m=new Date(cur);
        const diff=Math.round((m.getTime()-base.getTime())/86400000);
        const wOff=Math.round(diff/7);
        const wKey=wk(wOff);
        const wDsMap=daySlots[wKey]||{};
        const days=[];let wt=0;
        for(let di=0;di<7;di++){
          const d=new Date(m);d.setDate(m.getDate()+di);
          if(d.getMonth()!==month){days.push(null);continue;}
          const sz=wDsMap[di]==="30m"?0.5:1;
          const dayS3=(di===5||di===6)?(wDsMap[di]==="30m"?SLOTS_30:DEFAULT_SLOTS):[];
          const daySchedX=(emp.schedules[wKey]||{})[di]||{};
          const isDayOffX=dayS3.length>0&&dayS3.every(h=>daySchedX[h.l]==="VAC");
          const dh=isDayOffX?0:Object.values(daySchedX).filter(v=>v&&v.startsWith("TIT:")).length*sz;
          days.push({date:d,dh,di,isDayOff:isDayOffX});wt+=dh;
        }
        weeks.push({m,wKey,days,wt});
        cur.setDate(cur.getDate()+7);
      }
      const mt=weeks.reduce((s,w)=>s+w.wt,0);
      const mn=first.toLocaleString("es-ES",{month:"long",year:"numeric"});
      return {weeks,mt,mn};
    }catch(e){return {weeks:[],mt:0,mn:""};}
  },[weekOffset,emp,daySlots]);

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:980,width:"97vw",maxHeight:"90vh",display:"flex",flexDirection:"column",padding:0,overflow:"hidden"}}>
        <div style={{padding:"12px 18px",borderBottom:"1px solid #f1f5f9",display:"flex",alignItems:"center",gap:10,flexShrink:0,flexWrap:"wrap"}}>
          <div style={{flex:1}}>
            <div style={{fontSize:10,color:"#94a3b8",textTransform:"uppercase"}}>Semana del empleado</div>
            <div style={{fontWeight:700,fontSize:15}}>{emp.name}</div>
            <div style={{fontSize:11,color:"#94a3b8"}}>{dept.label} - {weekLabel}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:22,fontWeight:700,color:dept.color}}>{totalH}h</div>
            <div style={{fontSize:10,color:"#94a3b8"}}>semana</div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:4,background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:8,padding:"2px 6px"}}>
            <button onClick={()=>setZoom(z=>Math.max(0.5,parseFloat((z-0.1).toFixed(1))))} style={{background:"none",border:"none",cursor:"pointer",fontSize:16,fontWeight:700,color:"#64748b",padding:"0 4px"}}>-</button>
            <span style={{fontSize:11,color:"#64748b",minWidth:34,textAlign:"center"}}>{Math.round(zoom*100)}%</span>
            <button onClick={()=>setZoom(z=>Math.min(2,parseFloat((z+0.1).toFixed(1))))} style={{background:"none",border:"none",cursor:"pointer",fontSize:16,fontWeight:700,color:"#64748b",padding:"0 4px"}}>+</button>
          </div>
          <button className="btn" onClick={()=>setShowMonth({zoom:1})}>Mes</button>
          <button className="btn btn-primary" onClick={download}>Descargar</button>
          <button className="btn" onClick={onClose}>X</button>
        </div>
        <div style={{overflow:"auto",flex:1,padding:16}}>
          <div style={{transformOrigin:"top left",transform:"scale("+zoom+")",width:(100/zoom)+"%"}}>
            <div ref={ref} style={{background:"#fff",borderRadius:10,overflow:"hidden",border:"1px solid #e2e8f0",minWidth:"max-content"}}>
              <div style={{background:"linear-gradient(135deg,"+dept.color+","+hex2rgba(dept.color,0.7)+")",padding:"12px 18px",display:"flex",alignItems:"center",gap:12}}>
                <div style={{fontSize:24}}>{dept.icon}</div>
                <div>
                  <div style={{fontWeight:800,fontSize:16,color:"#fff"}}>{emp.name}</div>
                  <div style={{fontSize:12,color:"rgba(255,255,255,0.8)"}}>{dept.label} - {weekLabel}</div>
                </div>
                <div style={{marginLeft:"auto",textAlign:"right"}}>
                  <div style={{fontSize:26,fontWeight:800,color:"#fff"}}>{totalH}h</div>
                </div>
              </div>
              {[0,1,2,3,4,5,6].map(di=>{
                const ds=getSlotsForDay(di);
                const sz=dsMap[di]==="30m"?0.5:1;
                const dh=Object.values((emp.schedules[wkk]||{})[di]||{}).filter(v=>v&&v.startsWith("TIT:")).length*sz;
                return (
                  <div key={di} style={{borderBottom:(di<6)?"1px solid #f1f5f9":"none"}}>
                    {(()=>{
                      const daySlots2=dsMap[di]==="30m"?SLOTS_30:DEFAULT_SLOTS;
                      const daySched=(emp.schedules[wkk]||{})[di]||{};
                      const isFullVac=daySlots2.length>0&&daySlots2.every(h=>daySched[h.l]==="VAC");
                      return (
                        <div style={{background:isFullVac?"#FEF3C7":(di===5||di===6)?"#f0fdf4":hex2rgba(dept.color,0.07),borderBottom:"2px solid "+(isFullVac?"#F59E0B":(di===5||di===6)?"#86efac":hex2rgba(dept.color,0.15)),padding:"5px 14px",display:"flex",alignItems:"baseline",gap:8}}>
                          <span style={{fontWeight:700,fontSize:13,color:isFullVac?"#D97706":(di===5||di===6)?"#16a34a":dept.color}}>{DAYS_F[di]}</span>
                          <span style={{fontSize:10,color:"#94a3b8"}}>{dayDate(mon,di)}</span>
                          {isFullVac&&<span style={{fontWeight:700,fontSize:12,color:"#D97706",background:"#FDE68A",padding:"1px 7px",borderRadius:99}}>🏖️ Día libre</span>}
                          {!isFullVac&&dh>0&&<span style={{fontWeight:700,fontSize:12,color:(di===5||di===6)?"#16a34a":dept.color,background:(di===5||di===6)?"#f0fdf4":hex2rgba(dept.color,0.12),padding:"1px 7px",borderRadius:99}}>{dh}h</span>}
                        </div>
                      );
                    })()}
                    <div style={{display:"flex",background:"#f8fafc",borderBottom:"1px solid #e2e8f0"}}>
                      {Object.entries(SHIFT_META).map(([sid,sm])=>{
                        const cols=ds.filter(h=>h.s===sid).length;
                        if(!cols)return null;
                        return <div key={sid} style={{width:cols*42,textAlign:"center",padding:"2px 0",fontSize:9,fontWeight:700,color:sm.text,background:sm.bg,borderRight:"1px solid "+hex2rgba(sm.color,0.3),borderTop:"2px solid "+sm.color}}>{sm.label}</div>;
                      })}
                    </div>
                    <div style={{display:"flex",background:"#f1f5f9",borderBottom:"1px solid #e2e8f0"}}>
                      {ds.map((h,hi)=>{
                        const sm=SHIFT_META[h.s];
                        const isLast=hi===ds.length-1||ds[hi+1].s!==h.s;
                        return <div key={hi} style={{width:42,textAlign:"center",padding:"2px 0",fontSize:9,color:sm.text,background:sm.bg,borderRight:isLast?"2px solid "+hex2rgba(sm.color,0.4):"1px solid "+hex2rgba(sm.color,0.12)}}>{h.l}</div>;
                      })}
                    </div>
                    <div style={{display:"flex",minHeight:34}}>
                      {ds.map((h,hi)=>{
                        const code=(emp.schedules[wkk]||{})[di]?.[h.l]||null;
                        const sm=SHIFT_META[h.s];
                        const isLast=hi===ds.length-1||ds[hi+1].s!==h.s;
                        let bg=sm.bg,label="";
                        if(code==="BAJA"){bg="#fef2f2";label="🤒";}
                        else if(code==="VAC"){bg="#ecfeff";label="🏖️";}
                        else if(code&&code.startsWith("TIT:")){bg="#ede9fe";label="✓";}
                        return <div key={hi} style={{width:42,minHeight:34,background:bg,borderRight:isLast?"2px solid "+hex2rgba(sm.color,0.35):"1px solid "+hex2rgba(sm.color,0.1),display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700,color:code&&code.startsWith("TIT:")?dept.color:"#888"}}>{label}</div>;
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
        {showMonth&&(
          <div className="overlay" onClick={()=>setShowMonth(null)}>
            <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:680,width:"96vw",maxHeight:"88vh",display:"flex",flexDirection:"column",padding:0,overflow:"hidden"}}>
              <div style={{padding:"12px 18px",borderBottom:"1px solid #f1f5f9",display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:10,color:"#94a3b8",textTransform:"uppercase"}}>Resumen mensual</div>
                  <div style={{fontWeight:700,fontSize:15}}>{emp.name}</div>
                  <div style={{fontSize:12,color:"#94a3b8",textTransform:"capitalize"}}>{monthData.mn}</div>
                </div>
                <div style={{fontSize:24,fontWeight:800,color:dept.color}}>{monthData.mt}h</div>
                <button className="btn" onClick={()=>setShowMonth(null)}>X</button>
              </div>
              <div style={{overflow:"auto",flex:1,padding:16}}>
                <div style={{transformOrigin:"top left",transform:"scale("+(showMonth.zoom||1)+")",width:(100/(showMonth.zoom||1))+"%"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                  <thead>
                    <tr style={{background:"#f8fafc"}}>
                      <th style={{textAlign:"left",padding:"8px 12px",fontWeight:600,color:"#64748b",borderBottom:"2px solid #e2e8f0",fontSize:11}}>Semana</th>
                      {[["Lun",false],["Mar",false],["Mie",false],["Jue",false],["Vie",false],["Sab",true],["Dom",true]].map(([d,isWE])=>(
                        <th key={d} style={{textAlign:"center",padding:"8px 6px",fontWeight:700,color:isWE?"#16a34a":"#64748b",borderBottom:"2px solid "+(isWE?"#86efac":"#e2e8f0"),fontSize:11,minWidth:48,background:isWE?"#f0fdf4":"transparent"}}>{d}</th>
                      ))}
                      <th style={{textAlign:"center",padding:"8px 12px",fontWeight:700,color:dept.color,borderBottom:"2px solid "+dept.color,fontSize:11}}>Total</th>
                    </tr>
                  </thead>
                  <tbody>
                    {monthData.weeks.map((wkRow,wi)=>(
                      <tr key={wi} style={{borderBottom:"1px solid #f1f5f9",background:wi%2===0?"#fff":"#fafbff"}}>
                        <td style={{padding:"8px 12px",fontSize:11,color:"#94a3b8"}}>{wkRow.m.getDate()}/{wkRow.m.getMonth()+1}</td>
                        {wkRow.days.map((day,di)=>(
                          <td key={di} style={{textAlign:"center",padding:"8px 6px"}}>
                            {day===null?<span style={{color:"#e2e8f0"}}>-</span>:day.isBaja?<span style={{fontWeight:700,color:"#dc2626",background:"#fef2f2",borderRadius:6,padding:"2px 8px"}}>🤒</span>:day.isDayOff?<span style={{fontWeight:700,color:"#D97706",background:"#FEF3C7",borderRadius:6,padding:"2px 8px"}}>🏖️</span>:day.dh>0?<span style={{fontWeight:700,color:(day.di===5||day.di===6)?"#16a34a":dept.color,background:(day.di===5||day.di===6)?"#f0fdf4":hex2rgba(dept.color,0.1),borderRadius:6,padding:"2px 8px"}}>{day.dh}h</span>:<span style={{color:(day.di===5||day.di===6)?"#86efac":"#e2e8f0",fontSize:11}}>.</span>}
                          </td>
                        ))}
                        <td style={{textAlign:"center",padding:"8px 12px",fontWeight:700,color:wkRow.wt>0?dept.color:"#cbd5e1"}}>{wkRow.wt>0?wkRow.wt+"h":"-"}</td>
                      </tr>
                    ))}
                  </tbody>
                  <tfoot>
                    <tr style={{background:hex2rgba(dept.color,0.06),borderTop:"2px solid "+dept.color}}>
                      <td colSpan={8} style={{padding:"10px 12px",fontWeight:700,color:dept.color,fontSize:13}}>Total del mes</td>
                      <td style={{textAlign:"center",padding:"10px 12px",fontWeight:800,fontSize:16,color:dept.color}}>{monthData.mt}h</td>
                    </tr>
                  </tfoot>
                </table>
                </div>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

                          return <div key={hi} style={{width:40,flexShrink:0,minHeight:32,background:bg,borderRight:isLast?"2px solid "+hex2rgba(sm.color,0.3):"1px solid "+hex2rgba(sm.color,0.1),display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,color:code&&code.startsWith("TIT:")?"#6d28d9":"#94a3b8"}}>{lbl}</div>;
                        })}
                        {(()=>{const dsM3=daySlots[wkk]||{};const sz3=dsM3[di]==="30m"?0.5:1;const s3=dsM3[di]==="30m"?SLOTS_30:DEFAULT_SLOTS;const isBajaDay=s3.length>0&&s3.every(h=>(emp.schedules[wkk]||{})[di]?.[h.l]==="BAJA");return <div style={{width:32,flexShrink:0,borderLeft:"1px solid #e2e8f0",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:isBajaDay?"#dc2626":dayH>0?dept.color:"#e2e8f0",background:isBajaDay?"#fef2f2":"transparent"}}>{isBajaDay?"🤒":dayH>0?dayH:""}</div>;})()}
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

// --- DeptMonthModal ---
function DeptMonthModal({dept,deptEmps,weekOffset,daySlots,festivos,activeDeptId,onClose}){
  const [zoom,setZoom]=useState(1);
  const mon=getMonday(weekOffset);
  const year=mon.getFullYear(), month=mon.getMonth();
  const first=new Date(year,month,1), last=new Date(year,month+1,0);
  const startMon=new Date(first);
  const dow=startMon.getDay(); startMon.setDate(startMon.getDate()+(dow===0?-6:1-dow));
  const base=getMonday(0);
  const ref=useRef(null);
  const monthName=first.toLocaleString("es-ES",{month:"long",year:"numeric"});

  // Build all days of the month (only days within the month)
  const allDays=[];
  let cur=new Date(startMon);
  while(cur<=last){
    for(let di=0;di<7;di++){
      const d=new Date(cur); d.setDate(cur.getDate()+di);
      if(d.getMonth()!==month) continue;
      const diff=Math.round((cur.getTime()-base.getTime())/86400000);
      const wOff=Math.round(diff/7);
      const wKey=wk(wOff);
      allDays.push({date:new Date(d),di,wKey});
    }
    cur.setDate(cur.getDate()+7);
  }

  // For each emp+day compute hours and day-off status
  function getEmpDay(emp,day){
    const dsMap=daySlots[day.wKey]||{};
    const slots2=dsMap[day.di]==="30m"?SLOTS_30:DEFAULT_SLOTS;
    const sched=(emp.schedules[day.wKey]||{})[day.di]||{};
    const sz=dsMap[day.di]==="30m"?0.5:1;
    const isFestDay=!!(festivos[activeDeptId]?.[day.wKey]||[]).includes(day.di);
    const isWeekendLikeDay=day.di===5||day.di===6||isFestDay;
    const isOff=isWeekendLikeDay&&slots2.length>0&&slots2.every(h=>sched[h.l]==="VAC");
    const isBaja=slots2.length>0&&slots2.every(h=>sched[h.l]==="BAJA");
    const h=isOff||isBaja?0:Object.values(sched).filter(v=>v&&v.startsWith("TIT:")).length*sz;
    return {isOff,isBaja,h,isFestDay};
  }

  function download(){
    if(!window.html2canvas||!ref.current)return;
    window.html2canvas(ref.current,{scale:2,backgroundColor:"#fff",useCORS:true}).then(canvas=>{
      const a=document.createElement("a"); a.download=dept.label+"-mes.png"; a.href=canvas.toDataURL("image/png"); a.click();
    });
  }

  const COL_W=44;
  const NAME_W=140;

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:"98vw",width:1200,maxHeight:"92vh",display:"flex",flexDirection:"column",padding:0,overflow:"hidden",borderRadius:14}}>
        {/* Header */}
        <div style={{padding:"12px 18px",borderBottom:"1px solid #e2e8f0",display:"flex",alignItems:"center",gap:12,background:"#fff",flexShrink:0}}>
          <div style={{flex:1}}>
            <div style={{fontSize:11,color:"#94a3b8",textTransform:"uppercase"}}>Horario mensual</div>
            <div style={{fontWeight:700,fontSize:16}}>{dept.icon} {dept.label} - {monthName}</div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:4,background:"#f1f5f9",border:"1px solid #e2e8f0",borderRadius:8,padding:"3px 8px"}}>
            <button onClick={()=>setZoom(z=>Math.max(0.5,parseFloat((z-0.1).toFixed(1))))} style={{background:"none",border:"none",cursor:"pointer",fontSize:16,fontWeight:700,color:"#64748b",padding:"0 3px"}}>-</button>
            <span style={{fontSize:11,color:"#64748b",minWidth:32,textAlign:"center"}}>{Math.round(zoom*100)}%</span>
            <button onClick={()=>setZoom(z=>Math.min(2,parseFloat((z+0.1).toFixed(1))))} style={{background:"none",border:"none",cursor:"pointer",fontSize:16,fontWeight:700,color:"#64748b",padding:"0 3px"}}>+</button>
          </div>
          <button className="btn btn-primary" onClick={download}>Descargar PNG</button>
          <button className="btn" onClick={onClose}>X</button>
        </div>
        {/* Table */}
        <div style={{overflow:"auto",flex:1,padding:12}}>
          <div style={{transformOrigin:"top left",transform:"scale("+zoom+")",minWidth:(100/zoom)+"%"}}>
          <div ref={ref} style={{background:"#fff",display:"inline-block",minWidth:"100%",borderRadius:10,overflow:"hidden",border:"1px solid #e2e8f0"}}>
            {/* Header: dept + gradient */}
            <div style={{background:"linear-gradient(135deg,"+dept.color+","+hex2rgba(dept.color,0.7)+")",padding:"12px 18px",display:"flex",alignItems:"center",gap:12}}>
              <span style={{fontSize:22}}>{dept.icon}</span>
              <div>
                <div style={{fontWeight:800,fontSize:15,color:"#fff"}}>{dept.label}</div>
                <div style={{fontSize:12,color:"rgba(255,255,255,0.8)",textTransform:"capitalize"}}>{monthName}</div>
              </div>
            </div>
            {/* Day headers row */}
            <div style={{display:"flex",background:"#f8fafc",borderBottom:"2px solid #e2e8f0",position:"sticky",top:0,zIndex:2}}>
              <div style={{width:NAME_W,flexShrink:0,padding:"6px 12px",fontSize:11,fontWeight:700,color:"#475569",borderRight:"2px solid #e2e8f0",display:"flex",alignItems:"center"}}>Nombre</div>
              {allDays.map((day,i)=>{
                const isWE=day.di===5||day.di===6;
                const isSun=day.di===6;
                const isFest=!!(festivos[activeDeptId]?.[day.wKey]||[]).includes(day.di);
                const isWElike=isWE||isFest;
                return (
                  <div key={i} style={{width:COL_W,flexShrink:0,textAlign:"center",padding:"4px 2px",borderRight:"1px solid "+(isWElike?"#86efac":"#e2e8f0"),background:isWElike?(isSun?"#f0fdf4":"#ecfdf5"):"transparent",borderTop:"2px solid "+(isWElike?(isSun?"#16a34a":"#16a34a"):dept.color)}}>
                    <div style={{fontSize:9,fontWeight:700,color:isWElike?"#16a34a":"#64748b"}}>{isFest?"🎉":DAYS_S[day.di]}</div>

              <div style={{width:56,flexShrink:0,textAlign:"center",padding:"6px 4px",borderLeft:"2px solid #e2e8f0",fontSize:11,fontWeight:700,color:dept.color,display:"flex",alignItems:"center",justifyContent:"center"}}>Total</div>
            </div>
            {/* Employee rows */}
            {deptEmps.map((emp,ei)=>{
              let weekTotal=0;
              return (
                <div key={emp.id} style={{display:"flex",borderBottom:"1px solid #f1f5f9",background:ei%2===0?"#fff":"#fafbff",minHeight:36}}>
                  <div style={{width:NAME_W,flexShrink:0,padding:"0 10px",fontSize:13,fontWeight:600,color:"#1e293b",borderRight:"2px solid #e2e8f0",display:"flex",alignItems:"center",gap:6,overflow:"hidden"}}>
                  <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{emp.name}</span>
                  {(()=>{const rH=allDays.reduce((s,day)=>{const {isOff,h}=getEmpDay(emp,day);return s+(isOff?0:h);},0);return rH>0?<span style={{flexShrink:0,fontWeight:700,color:dept.color,background:hex2rgba(dept.color,0.1),borderRadius:99,padding:"1px 7px",fontSize:11}}>{rH}h</span>:null;})()}
                </div>
                  {allDays.map((day,i)=>{
                    const {isOff,h}=getEmpDay(emp,day);
                    const isWE=day.di===5||day.di===6;
                    const isSun=day.di===6;
                    const isFest=!!(festivos[activeDeptId]?.[day.wKey]||[]).includes(day.di);
                    const isWElike=isWE||isFest;
                    weekTotal+=h;
                    let bg="transparent", content2=null, bdr="1px solid "+(isWElike?"#86efac":"#f1f5f9");
                    if(isOff){bg="#FEF3C7";content2=<span style={{fontSize:14}}>🏖️</span>;}
                    else if(h>0){bg=isWElike?"#ecfdf5":hex2rgba(dept.color,0.08);content2=<span style={{fontSize:10,fontWeight:700,color:isWElike?"#16a34a":dept.color}}>{h}h</span>;}
                    else if(isWElike){bg="#ecfdf5";}

                return (

              <div style={{width:56,flexShrink:0,borderLeft:"2px solid #e2e8f0"}}/>
            </div>
          </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// --- DaysOffHistoryModal ---
function DaysOffHistoryModal({dept,deptEmps,daySlots,festivos,activeDeptId,onClose}){
  const [zoom,setZoom]=useState(1);
  // Scan all weeks in schedules for Sat/Sun days off
  // Collect all wk keys across all emps
  const allWkKeys=new Set();
  deptEmps.forEach(emp=>Object.keys(emp.schedules).forEach(k=>allWkKeys.add(k)));

  const base=getMonday(0);
  // For each wk key, compute the Monday date
  function wkDate(wkKey){
    const n=parseInt(wkKey.slice(1));
    const d=new Date(base); d.setDate(base.getDate()+n*7); return d;
  }

  // Build: for each emp, list of days off (Sat/Sun) with date
  const empDaysOff=deptEmps.map(emp=>{
    const offs=[];
    allWkKeys.forEach(wkKey=>{
      const mon=wkDate(wkKey);
      const dsMap=daySlots[wkKey]||{};
      const festDays=(festivos[activeDeptId]?.[wkKey]||[]);
      const checkDays=[5,6,...festDays.filter(d=>d!==5&&d!==6)];
      checkDays.forEach(di=>{
        const slots2=dsMap[di]==="30m"?SLOTS_30:DEFAULT_SLOTS;
        const sched=(emp.schedules[wkKey]||{})[di]||{};
        const isOff=slots2.length>0&&slots2.every(h=>sched[h.l]==="VAC");
        if(isOff){
          const d=new Date(mon); d.setDate(mon.getDate()+di);
          offs.push({date:d,di,wkKey});
        }
      });
    });
    offs.sort((a,b)=>a.date-b.date);
    return {emp,offs};
  });

  // Get all unique Sat/Sun dates across all emps for column headers
  const allDates=[];
  const seen=new Set();
  empDaysOff.forEach(({offs})=>offs.forEach(o=>{
    const key=o.date.toISOString().slice(0,10);
    if(!seen.has(key)){seen.add(key);allDates.push({date:o.date,di:o.di,wkKey:o.wkKey});}
  }));
  allDates.sort((a,b)=>a.date-b.date);

  const ref=useRef(null);
  function download(){
    if(!window.html2canvas||!ref.current)return;
    window.html2canvas(ref.current,{scale:2,backgroundColor:"#fff",useCORS:true}).then(canvas=>{
      const a=document.createElement("a"); a.download=dept.label+"-dias-libres.png"; a.href=canvas.toDataURL("image/png"); a.click();
    });
  }

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:"98vw",width:1100,maxHeight:"92vh",display:"flex",flexDirection:"column",padding:0,overflow:"hidden",borderRadius:14}}>
        <div style={{padding:"12px 18px",borderBottom:"1px solid #e2e8f0",display:"flex",alignItems:"center",gap:12,background:"#fff",flexShrink:0}}>
          <div style={{flex:1}}>
            <div style={{fontSize:11,color:"#94a3b8",textTransform:"uppercase"}}>Historial días libres</div>
            <div style={{fontWeight:700,fontSize:16}}>{dept.icon} {dept.label} — Fines de semana y festivos</div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:4,background:"#f1f5f9",border:"1px solid #e2e8f0",borderRadius:8,padding:"3px 8px"}}>
            <button onClick={()=>setZoom(z=>Math.max(0.5,parseFloat((z-0.1).toFixed(1))))} style={{background:"none",border:"none",cursor:"pointer",fontSize:16,fontWeight:700,color:"#64748b",padding:"0 3px"}}>-</button>
            <span style={{fontSize:11,color:"#64748b",minWidth:32,textAlign:"center"}}>{Math.round(zoom*100)}%</span>
            <button onClick={()=>setZoom(z=>Math.min(2,parseFloat((z+0.1).toFixed(1))))} style={{background:"none",border:"none",cursor:"pointer",fontSize:16,fontWeight:700,color:"#64748b",padding:"0 3px"}}>+</button>
          </div>
          <button className="btn btn-primary" onClick={download}>Descargar PNG</button>
          <button className="btn" onClick={onClose}>X</button>
        </div>
        <div style={{overflow:"auto",flex:1,padding:12}}>
          {allDates.length===0?(
            <div style={{textAlign:"center",padding:"60px 20px",color:"#94a3b8",fontSize:14}}>No hay días libres registrados todavia.</div>
          ):(
            <div style={{transformOrigin:"top left",transform:"scale("+zoom+")",minWidth:(100/zoom)+"%"}}>
            <div ref={ref} style={{background:"#fff",minWidth:"max-content"}}>
              {/* Header row with dates */}
              <div style={{display:"flex",borderBottom:"2px solid #e2e8f0",background:"#f8fafc",position:"sticky",top:0,zIndex:2}}>
                <div style={{width:160,flexShrink:0,padding:"8px 12px",fontSize:12,fontWeight:700,color:"#475569",borderRight:"2px solid #e2e8f0"}}>Empleado</div>
                {allDates.map((d,i)=>{
                  const isWE=d.di===5||d.di===6;
                  const isSun=d.di===6;
                  const isFest=!isWE;
                  const dayLabel=DAYS_S[d.di]||"?";
                  const bg=isSun?"#f0fdf4":isWE?"#fff7ed":"#ecfdf5";
                  const col=isSun?"#16a34a":isWE?"#D97706":"#059669";
                  return (
                    <div key={i} style={{width:80,flexShrink:0,padding:"6px 4px",textAlign:"center",borderRight:"1px solid #e2e8f0",background:bg}}>
                      <div style={{fontSize:11,fontWeight:700,color:col}}>{isFest?"🎉 ":""}{dayLabel}</div>
