                  <div style={{fontSize:11,fontWeight:700,color:"#475569"}}>Total</div>
                </div>
              </div>
              {/* Employee rows */}
              {empDaysOff.map(({emp,offs},ri)=>{
                const offKeys=new Set(offs.map(o=>o.date.toISOString().slice(0,10)));
                return (
                  <div key={emp.id} style={{display:"flex",borderBottom:"1px solid #f1f5f9",background:ri%2===0?"#fff":"#fafbff"}}>
                    <div style={{width:160,flexShrink:0,padding:"6px 10px",fontSize:13,fontWeight:600,color:"#1e293b",borderRight:"2px solid #e2e8f0",display:"flex",alignItems:"center",gap:6,overflow:"hidden"}}>
                    <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{emp.name}</span>
                    {offs.length>0&&<span style={{flexShrink:0,fontWeight:700,color:"#D97706",background:"#FEF3C7",borderRadius:99,padding:"1px 7px",fontSize:11}}>{offs.length}d</span>}
                  </div>
                    {allDates.map((d,i)=>{
                      const key=d.date.toISOString().slice(0,10);
                      const hasOff=offKeys.has(key);
                      const isWE=d.di===5||d.di===6;
                      const isSun=d.di===6;
                      const bg=hasOff?(isSun?"#f0fdf4":isWE?"#FFFBEB":"#ecfdf5"):"transparent";
                      return (
                        <div key={i} style={{width:80,flexShrink:0,textAlign:"center",borderRight:"1px solid #e2e8f0",display:"flex",alignItems:"center",justifyContent:"center",background:bg,minHeight:44}}>
                          {hasOff
                            ? <span style={{fontSize:18,filter:"drop-shadow(0 1px 2px rgba(0,0,0,0.1))"}}>🏖️</span>
                            : <span style={{fontSize:14,color:"#e2e8f0"}}>-</span>
                          }
                        </div>
                      );
                    })}
                    <div style={{width:80,flexShrink:0,textAlign:"center",borderLeft:"2px solid #e2e8f0",display:"flex",alignItems:"center",justifyContent:"center",background:"#f8fafc"}}>
                      <span style={{fontSize:14,fontWeight:700,color:offs.length>0?"#D97706":"#cbd5e1"}}>{offs.length>0?offs.length+"d":"-"}</span>
                    </div>
                  </div>
                );
              })}
              {/* Total row */}
              <div style={{display:"flex",borderTop:"2px solid #e2e8f0",background:"#f8fafc",position:"sticky",bottom:0}}>
                <div style={{width:160,flexShrink:0,padding:"8px 12px",fontSize:12,fontWeight:700,color:"#475569",borderRight:"2px solid #e2e8f0"}}>Total por dia</div>
                {allDates.map((d,i)=>{
                  const key=d.date.toISOString().slice(0,10);
                  const total=empDaysOff.filter(({offs})=>offs.some(o=>o.date.toISOString().slice(0,10)===key)).length;
                  return (
                    <div key={i} style={{width:80,flexShrink:0,textAlign:"center",borderRight:"1px solid #e2e8f0",padding:"8px 4px"}}>
                      <span style={{fontSize:13,fontWeight:700,color:total>0?"#D97706":"#cbd5e1"}}>{total>0?total:"-"}</span>
                    </div>
                  );
                })}
                <div style={{width:80,flexShrink:0,borderLeft:"2px solid #e2e8f0"}}/>
              </div>
            </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}



// --- BajaModal ---
function BajaModal({emp,weekOffset,onClose,onApply}){
  const mon=getMonday(weekOffset);
  const fmt=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");return y+"-"+m+"-"+dd;};
  const [start,setStart]=useState(fmt(mon));
  const [end,setEnd]=useState(fmt(mon));
  const MONTHS_ES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const [calDate,setCalDate]=useState(new Date(mon.getFullYear(),mon.getMonth(),1));
  const year=calDate.getFullYear(), month=calDate.getMonth();
  const firstDay=new Date(year,month,1);
  const lastDay=new Date(year,month+1,0);
  const startDow=(firstDay.getDay()+6)%7;

  function isInRange(d){
    const ds=new Date(start+"T00:00:00"),de=new Date(end+"T00:00:00");
    return d>=ds&&d<=de;
  }
  function pickDay(d){
    const ds=fmt(d);
    if(!start||start===end){setStart(ds);setEnd(ds);}
    else if(ds<=start){setStart(ds);}
    else{setEnd(ds);}
  }

  const cells=[];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1;d<=lastDay.getDate();d++) cells.push(new Date(year,month,d));

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:340,padding:20}}>
        <div className="modal-title" style={{fontSize:16,marginBottom:10}}>Periodo de baja</div>
        <div style={{fontSize:13,color:"#475569",marginBottom:12}}>Empleado: <strong>{emp.name}</strong></div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
          <button onClick={()=>setCalDate(new Date(year,month-1,1))} style={{background:"none",border:"1px solid #e2e8f0",borderRadius:6,cursor:"pointer",padding:"4px 10px",fontSize:16}}>&#8249;</button>
          <span style={{fontWeight:700,fontSize:13}}>{MONTHS_ES[month]} {year}</span>
          <button onClick={()=>setCalDate(new Date(year,month+1,1))} style={{background:"none",border:"1px solid #e2e8f0",borderRadius:6,cursor:"pointer",padding:"4px 10px",fontSize:16}}>&#8250;</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:3}}>
          {["L","M","X","J","V","S","D"].map(d=>(
            <div key={d} style={{textAlign:"center",fontSize:10,fontWeight:700,color:"#94a3b8"}}>{d}</div>
          ))}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:14}}>
          {cells.map((d,i)=>{
            if(!d) return <div key={i}/>;
            const inR=isInRange(d);
            const isSt=fmt(d)===start;
            const isEn=fmt(d)===end;
            const isWE=d.getDay()===0||d.getDay()===6;
            return (
              <div key={i} onClick={()=>pickDay(d)} style={{textAlign:"center",padding:"6px 2px",borderRadius:6,cursor:"pointer",fontSize:12,fontWeight:isSt||isEn?700:400,
                background:isSt||isEn?"#ef4444":inR?"#fef2f2":"transparent",
                color:isSt||isEn?"#fff":inR?"#dc2626":isWE?"#94a3b8":"#1e293b",
                border:isSt||isEn?"2px solid #dc2626":inR?"2px solid #fca5a5":"2px solid transparent"}}>
                {d.getDate()}
              </div>
            );
          })}
        </div>
        <div style={{display:"flex",gap:8,marginBottom:12}}>
          <div style={{flex:1}}>
            <label className="form-label" style={{marginTop:0}}>Inicio</label>
            <input type="date" value={start} onChange={e=>{setStart(e.target.value);if(e.target.value>end)setEnd(e.target.value);}} className="form-input" style={{padding:"6px 10px",fontSize:13}}/>
          </div>
          <div style={{flex:1}}>
            <label className="form-label" style={{marginTop:0}}>Fin</label>
            <input type="date" value={end} min={start} onChange={e=>setEnd(e.target.value)} className="form-input" style={{padding:"6px 10px",fontSize:13}}/>
          </div>
        </div>
        {start&&end&&(
          <div style={{background:"#fef2f2",border:"1px solid #fca5a5",borderRadius:8,padding:"8px 12px",marginBottom:12,fontSize:12,color:"#dc2626"}}>
            Baja del <strong>{new Date(start+"T12:00:00").toLocaleDateString("es-ES")}</strong> al <strong>{new Date(end+"T12:00:00").toLocaleDateString("es-ES")}</strong>
          </div>
        )}
        <div className="modal-footer" style={{marginTop:0,paddingTop:10}}>
          <button className="btn" onClick={onClose}>Cancelar</button>
          <button className="btn btn-danger" disabled={!start||!end} onClick={()=>{if(start&&end){onApply(start,end);onClose();}}} style={{background:"#ef4444",color:"#fff",borderColor:"#ef4444"}}>
            Aplicar baja
          </button>
        </div>
      </div>
    </div>
  );
}

// --- TemplatesModal ---
function TemplatesModal({dept,weekOffset,weekLabel,slots,onSave,onRename,onDelete,onApply,onClear,onClose}){
  const [view,setView]=useState('list'); // 'list' | 'apply' | 'clear'
  const [applyIdx,setApplyIdx]=useState(null);
  const [names,setNames]=useState(()=>slots.map((s,i)=>s?s.name:("Opción "+(i+1))));
  const [pending,setPending]=useState(null);
  const [selectedWeeks,setSelectedWeeks]=useState(()=>new Set([weekOffset]));

  const WEEK_RANGE=[];
  for(let o=weekOffset-2;o<=weekOffset+13;o++) WEEK_RANGE.push(o);

  function weekRowLabel(offset){
    const m=getMonday(offset);
    const e=new Date(m); e.setDate(e.getDate()+6);
    let tag="";
    if(offset===0) tag=" (semana actual)";
    else if(offset===weekOffset) tag=" (semana abierta)";
    return fmtDate(m)+" - "+fmtDate(e)+tag;
  }
  function toggleWeek(offset){
    setSelectedWeeks(prev=>{
      const next=new Set(prev);
      if(next.has(offset)) next.delete(offset); else next.add(offset);
      return next;
    });
  }
  function requestSave(idx){
    if(slots[idx]) setPending({type:'save',idx});
    else onSave(idx,(names[idx]||"").trim()||("Opción "+(idx+1)));
  }
  function requestDelete(idx){ setPending({type:'delete',idx}); }
  function requestClear(){ setPending({type:'clearWeeks',offsets:Array.from(selectedWeeks)}); }
  function confirmPending(){
    if(!pending) return;
    if(pending.type==='save') onSave(pending.idx,(names[pending.idx]||"").trim()||("Opción "+(pending.idx+1)));
    else if(pending.type==='delete') onDelete(pending.idx);
    else if(pending.type==='clearWeeks'){ onClear(pending.offsets); onClose(); }
    setPending(null);
  }
  const applying=applyIdx!=null?slots[applyIdx]:null;
  const weekChecklist=(
    <>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
        <button className="btn" style={{fontSize:11,padding:"5px 10px"}} onClick={()=>setSelectedWeeks(new Set([weekOffset]))}>Solo esta semana</button>
        <button className="btn" style={{fontSize:11,padding:"5px 10px"}} onClick={()=>setSelectedWeeks(new Set(Array.from({length:4},(_,i)=>weekOffset+i)))}>Próximas 4</button>
        <button className="btn" style={{fontSize:11,padding:"5px 10px"}} onClick={()=>setSelectedWeeks(new Set(Array.from({length:8},(_,i)=>weekOffset+i)))}>Próximas 8</button>
        <button className="btn" style={{fontSize:11,padding:"5px 10px"}} onClick={()=>setSelectedWeeks(new Set())}>Ninguna</button>
      </div>
      <div style={{maxHeight:260,overflowY:"auto",border:"1px solid var(--border)",borderRadius:10,padding:6}}>
        {WEEK_RANGE.map(offset=>(
          <label key={offset} className={"week-check-row"+(offset===weekOffset?" current":"")}>
            <input type="checkbox" checked={selectedWeeks.has(offset)} onChange={()=>toggleWeek(offset)}/>
            <span style={{fontSize:12.5,fontWeight:offset===weekOffset?700:500}}>{weekRowLabel(offset)}</span>
          </label>
        ))}
      </div>
    </>
  );

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:500}}>
        {view==='list'&&(
          <>
            <div className="modal-title">Plantillas de horario — {dept.icon} {dept.label}</div>
            <p style={{fontSize:12.5,color:"var(--text-2)",marginBottom:14,lineHeight:1.5}}>
              Guarda el horario de la semana abierta (<strong>{weekLabel}</strong>) en una de estas 5 opciones. Después podrás aplicar cualquiera de ellas a otras semanas para no repetir el trabajo.
            </p>
            {[0,1,2,3,4].map(idx=>{
              const s=slots[idx];
              return (
                <div key={idx} className={"tpl-row"+(s?" filled":"")}>
                  <input className="tpl-name-input" value={names[idx]}
                    onChange={e=>setNames(prev=>{const n=[...prev];n[idx]=e.target.value;return n;})}
                    onBlur={()=>{const v=(names[idx]||"").trim(); if(s&&v&&v!==s.name)onRename(idx,v); if(!v)setNames(prev=>{const n=[...prev];n[idx]=s?s.name:("Opción "+(idx+1));return n;});}}/>
                  <span className="tpl-meta">{s?("Guardada "+new Date(s.savedAt).toLocaleDateString("es-ES")):"Vacío"}</span>
                  <button className="btn" style={{padding:"6px 10px",fontSize:11}} onClick={()=>requestSave(idx)}>💾 Guardar aquí</button>
                  <button className="btn btn-primary" style={{padding:"6px 10px",fontSize:11}} disabled={!s}
                    onClick={()=>{setApplyIdx(idx);setSelectedWeeks(new Set([weekOffset]));setView('apply');}}>▶ Usar</button>
                  {s&&<button onClick={()=>requestDelete(idx)} title="Borrar plantilla" style={{background:"none",border:"none",cursor:"pointer",color:"#ef4444",fontSize:14,padding:"2px 4px"}}>🗑</button>}
                </div>
              );
            })}
            <div className="modal-footer" style={{justifyContent:"space-between"}}>
              <button className="btn btn-danger" onClick={()=>{setSelectedWeeks(new Set([weekOffset]));setView('clear');}}>🧹 Limpiar semanas completas</button>
              <button className="btn" onClick={onClose}>Cerrar</button>
            </div>
          </>
        )}
        {view==='apply'&&(
          <>
            <div className="modal-title">Aplicar "{applying?applying.name:""}"</div>
            <p style={{fontSize:12.5,color:"var(--text-2)",marginBottom:10,lineHeight:1.5}}>
              Elige a qué semanas quieres copiar este horario para <strong>{dept.label}</strong>. Se sobrescribirá el horario de esas semanas para el personal incluido en la plantilla.
            </p>
            {weekChecklist}
            <div className="modal-footer">
              <button className="btn" onClick={()=>setView('list')}>Volver</button>
              <button className="btn btn-primary" disabled={selectedWeeks.size===0}
                onClick={()=>{onApply(applyIdx,Array.from(selectedWeeks));onClose();}}>
                Aplicar a {selectedWeeks.size} semana{selectedWeeks.size===1?"":"s"}
              </button>
            </div>
          </>
        )}
        {view==='clear'&&(
          <>
            <div className="modal-title">Limpiar semanas completas</div>
            <p style={{fontSize:12.5,color:"var(--text-2)",marginBottom:10,lineHeight:1.5}}>
              Elige qué semanas quieres dejar completamente vacías para <strong>{dept.label}</strong>. Se borrarán todos los turnos, bajas y vacaciones del personal de este departamento en esas semanas.
            </p>
            {weekChecklist}
            <div className="modal-footer">
              <button className="btn" onClick={()=>setView('list')}>Volver</button>
              <button className="btn btn-danger" disabled={selectedWeeks.size===0} onClick={requestClear}>
                🧹 Vaciar {selectedWeeks.size} semana{selectedWeeks.size===1?"":"s"}
              </button>
            </div>
          </>
        )}
      </div>
      {pending&&(
        <div onClick={e=>e.stopPropagation()}>
          <ConfirmModal
            title={pending.type==='save'?"Sobrescribir plantilla":pending.type==='delete'?"Borrar plantilla":"Vaciar semanas"}
            message={pending.type==='save'
              ?("Ya existe una plantilla guardada en \""+(slots[pending.idx]&&slots[pending.idx].name)+"\". ¿Sustituirla por el horario de "+weekLabel+"?")
              :pending.type==='delete'
              ?("¿Borrar la plantilla \""+(slots[pending.idx]&&slots[pending.idx].name)+"\"?")
              :("¿Vaciar por completo "+pending.offsets.length+" semana"+(pending.offsets.length===1?"":"s")+" para "+dept.label+"? Se perderán todos los turnos, bajas y vacaciones del personal de este departamento en esas semanas.")}
            warning="Esta acción no se puede deshacer."
            danger
            onConfirm={confirmPending}
            onClose={()=>setPending(null)}/>
        </div>
      )}
    </div>
  );
}

// --- Main App ---
function App(){
  const [depts,setDepts]=useState(()=>ls("hsa_depts",INITIAL_DEPTS));
  const [emps,setEmps]=useState(()=>{const saved=ls("hsa_emps",null);return saved&&saved.length>0?saved:INITIAL_EMPLOYEES;});
  const [activeDeptId,setActiveDeptId]=useState(()=>ls("hsa_dept","dependientas"));
  const [weekOffset,setWeekOffset]=useState(0);
  const [selDay,setSelDay]=useState(()=>{const d=new Date().getDay();return d===0?6:d-1;});
  const [daySlots,setDaySlots]=useState(()=>ls("hsa_dayslots",{}));
  const [inlineCP,setInlineCP]=useState(null);
  const [addEmpModal,setAddEmpModal]=useState(false);
  const [deptFormModal,setDeptFormModal]=useState(null);
  const [confirmModal,setConfirmModal]=useState(null);
  const [weekSnap,setWeekSnap]=useState(false);
  const [deptMonthSnap,setDeptMonthSnap]=useState(false);
  const [daysOffHistory,setDaysOffHistory]=useState(false);
  const [bajaModal,setBajaModal]=useState(null);
  // Schedule range: {deptId: {wkKey: {morningStart, dinnerEnd}}}
  const [schedRange,setSchedRange]=useState(()=>ls('hsa_schedrange',{}));
  const [festivos,setFestivos]=useState(()=>ls('hsa_festivos',{}));
  const [templates,setTemplates]=useState(()=>ls('hsa_templates',{}));
  const [templatesOpen,setTemplatesOpen]=useState(false);
  useEffect(()=>{lsSet('hsa_festivos',festivos);},[festivos]);
  useEffect(()=>{lsSet('hsa_templates',templates);},[templates]);

  function getTemplateSlots(deptId){
    const arr=templates[deptId]||[];
    return [0,1,2,3,4].map(i=>arr[i]||null);
  }
  function buildTemplateData(deptId,wkKey){
    const employees={};
    emps.filter(e=>e.dept===deptId).forEach(e=>{
      employees[e.id]=e.schedules[wkKey]?JSON.parse(JSON.stringify(e.schedules[wkKey])):{};
    });
    return {
      employees,
      schedRange:schedRange[deptId]&&schedRange[deptId][wkKey]?JSON.parse(JSON.stringify(schedRange[deptId][wkKey])):{},
      festivos:(festivos[deptId]&&festivos[deptId][wkKey]||[]).slice(),
      daySlots:JSON.parse(JSON.stringify(daySlots[wkKey]||{})),
    };
  }
  function saveTemplate(deptId,slotIdx,name){
    const data=buildTemplateData(deptId,wkk);
    setTemplates(prev=>{
      const arr=(prev[deptId]||[null,null,null,null,null]).slice();
      while(arr.length<5)arr.push(null);
      arr[slotIdx]={name,savedAt:Date.now(),data};
      return {...prev,[deptId]:arr};
    });
    toast('Plantilla "'+name+'" guardada',"success");
  }
  function renameTemplate(deptId,slotIdx,name){
    setTemplates(prev=>{
      const arr=(prev[deptId]||[null,null,null,null,null]).slice();
      if(arr[slotIdx])arr[slotIdx]={...arr[slotIdx],name};
      return {...prev,[deptId]:arr};
    });
  }
  function deleteTemplate(deptId,slotIdx){
    setTemplates(prev=>{
      const arr=(prev[deptId]||[null,null,null,null,null]).slice();
      arr[slotIdx]=null;
      return {...prev,[deptId]:arr};
    });
  }
  function applyTemplate(deptId,slotIdx,targetOffsets){
    const tpl=(templates[deptId]||[])[slotIdx];
    if(!tpl)return;
    const data=tpl.data;
    targetOffsets.forEach(offset=>{
      const targetWk=wk(offset);
      setEmps(prev=>prev.map(e=>{
        if(e.dept!==deptId||!(e.id in data.employees))return e;
        return {...e,schedules:{...e.schedules,[targetWk]:JSON.parse(JSON.stringify(data.employees[e.id]))}};
      }));
      setDaySlots(prev=>({...prev,[targetWk]:{...(prev[targetWk]||{}),...data.daySlots}}));
      setSchedRange(prev=>({...prev,[deptId]:{...(prev[deptId]||{}),[targetWk]:JSON.parse(JSON.stringify(data.schedRange))}}));
      setFestivos(prev=>({...prev,[deptId]:{...(prev[deptId]||{}),[targetWk]:data.festivos.slice()}}));
    });
    toast('Plantilla aplicada a '+targetOffsets.length+' semana'+(targetOffsets.length===1?'':'s'),"success");
  }
  function clearWeeksForDept(deptId,targetOffsets){
    targetOffsets.forEach(offset=>{
      const targetWk=wk(offset);
      setEmps(prev=>prev.map(e=>{
        if(e.dept!==deptId)return e;
        const s={...e.schedules};
        delete s[targetWk];
        return {...e,schedules:s};
      }));
    });
  }
  function dayHasAnyShifts(wkKey,dayIdx){
    return emps.some(e=>{
      const day=(e.schedules[wkKey]||{})[dayIdx];
      return day&&Object.keys(day).length>0;
    });
  }
  function clearDayAllDepts(wkKey,dayIdx){
    setEmps(prev=>prev.map(e=>{
      const week={...(e.schedules[wkKey]||{})};
      if(!week[dayIdx])return e;
      delete week[dayIdx];
      return {...e,schedules:{...e.schedules,[wkKey]:week}};
    }));
  }
  function changeDaySlotSize(wkKey,dayIdx,newSize){
    const cur=(daySlots[wkKey]||{})[dayIdx]==="30m"?"30m":"1h";
    if(cur===newSize)return;
    const apply=()=>setDaySlots(prev=>({...prev,[wkKey]:{...(prev[wkKey]||{}),[dayIdx]:newSize}}));
    if(dayHasAnyShifts(wkKey,dayIdx)){
      setConfirmModal({
        title:"Cambiar duración de franja",
        message:"Ya hay turnos asignados ese día con franjas de "+(cur==="30m"?"30 minutos":"1 hora")+". Para que las horas totales no se descuadren, hay que vaciar ese día (en todos los departamentos) antes de cambiar a franjas de "+(newSize==="30m"?"30 minutos":"1 hora")+".",
        warning:"Esta acción no se puede deshacer.",
        danger:true,
        onConfirm:()=>{clearDayAllDepts(wkKey,dayIdx);apply();}
      });
    }else{
      apply();
    }
  }

  function isFestivo(deptId,wkKey,dayIdx){return !!(festivos[deptId]?.[wkKey]||[]).includes(dayIdx);}
  function isWeekendLike(dayIdx){return dayIdx===5||dayIdx===6||isFestivo(activeDeptId,wkk,dayIdx);}
  function toggleFestivo(deptId,wkKey,dayIdx){
    setFestivos(prev=>{
      const cur=(prev[deptId]?.[wkKey]||[]);
      const next=cur.includes(dayIdx)?cur.filter(d=>d!==dayIdx):[...cur,dayIdx];
      return {...prev,[deptId]:{...(prev[deptId]||{}),[wkKey]:next}};
    });
  }
  useEffect(()=>{lsSet('hsa_schedrange',schedRange);},[schedRange]);

  function getMorningStart(deptId,wkKey,dayIdx){return schedRange[deptId]?.[wkKey]?.[dayIdx]?.morningStart||"00:00";}
  function getDinnerEnd(deptId,wkKey,dayIdx){return schedRange[deptId]?.[wkKey]?.[dayIdx]?.dinnerEnd||"24:00";}
  function setMorningStart(deptId,wkKey,dayIdx,val){
    setSchedRange(prev=>({...prev,[deptId]:{...(prev[deptId]||{}),[wkKey]:{...(prev[deptId]?.[wkKey]||{}),[dayIdx]:{...(prev[deptId]?.[wkKey]?.[dayIdx]||{}),morningStart:val}}}}));
  }
  function setDinnerEnd(deptId,wkKey,dayIdx,val){
    setSchedRange(prev=>({...prev,[deptId]:{...(prev[deptId]||{}),[wkKey]:{...(prev[deptId]?.[wkKey]||{}),[dayIdx]:{...(prev[deptId]?.[wkKey]?.[dayIdx]||{}),dinnerEnd:val}}}}));
  }
  function applyMorningStartFrom(deptId,wkKey,fromDay,val){
    setSchedRange(prev=>{
      const wk2={...(prev[deptId]?.[wkKey]||{})};
      for(let d=fromDay;d<7;d++){wk2[d]={...(wk2[d]||{}),morningStart:val};}
      return {...prev,[deptId]:{...(prev[deptId]||{}),[wkKey]:wk2}};
    });
  }
  function applyDinnerEndFrom(deptId,wkKey,fromDay,val){
    setSchedRange(prev=>{
      const wk2={...(prev[deptId]?.[wkKey]||{})};
      for(let d=fromDay;d<7;d++){wk2[d]={...(wk2[d]||{}),dinnerEnd:val};}
      return {...prev,[deptId]:{...(prev[deptId]||{}),[wkKey]:wk2}};
    });
  }
  const [empSnap,setEmpSnap]=useState(null);
  const [settingsOpen,setSettingsOpen]=useState(false);
  const [titleEdit,setTitleEdit]=useState(false);
  const [appTitle,setAppTitle]=useState(()=>ls("hsa_title","Horarios"));
  const [appFont,setAppFont]=useState(()=>ls("hsa_font","system-ui"));
  const [appFontSize,setAppFontSize]=useState(()=>ls("hsa_fontsize",14));
  const [appBg,setAppBg]=useState(()=>ls("hsa_bg","#f8fafc"));
  const [darkMode,setDarkMode]=useState(false);
  const [sidebarOpen,setSidebarOpen]=useState(false);
  const [viewMode,setViewMode]=useState(()=>ls('hsa_viewmode','pc'));
  const [tableZoom,setTableZoom]=useState(1);
  const [reportsOpen,setReportsOpen]=useState(false);
  const [numPickerOpen,setNumPickerOpen]=useState(false);
  const [numInput,setNumInput]=useState("");
  const [toasts,setToasts]=useState([]);
  const [empFilter,setEmpFilter]=useState("");
  const toastId=useRef(0);
  const toast=(msg,type="info")=>{
    const id=++toastId.current;
    setToasts(prev=>[...prev.slice(-4),{id,msg,type}]);
    setTimeout(()=>setToasts(prev=>prev.filter(t=>t.id!==id)),2800);
  };
  const dismissToast=id=>setToasts(prev=>prev.filter(t=>t.id!==id));

  useEffect(()=>{
    function onKey(e){
      if(e.key!=="Escape")return;
      if(numPickerOpen)setNumPickerOpen(false);
      else if(reportsOpen)setReportsOpen(false);
      else if(sidebarOpen)setSidebarOpen(false);
      else if(inlineCP)setInlineCP(null);
    }
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);
  },[numPickerOpen,reportsOpen,sidebarOpen,inlineCP]);

  useEffect(()=>{
    document.body.style.fontFamily=appFont;
    document.body.style.fontSize=appFontSize+"px";
    document.documentElement.style.setProperty("--app-bg",appBg);
    document.documentElement.style.setProperty("--app-fs",appFontSize+"px");
    document.body.style.background=appBg;
    lsSet("hsa_font",appFont);lsSet("hsa_fontsize",appFontSize);lsSet("hsa_bg",appBg);
  },[appFont,appFontSize,appBg]);

  useEffect(()=>{lsSet("hsa_depts",depts);},[depts]);
  useEffect(()=>{lsSet("hsa_emps",emps);},[emps]);
  useEffect(()=>{lsSet("hsa_dept",activeDeptId);},[activeDeptId]);
  useEffect(()=>{lsSet("hsa_dayslots",daySlots);},[daySlots]);
  useEffect(()=>{lsSet("hsa_title",appTitle);},[appTitle]);
  useEffect(()=>{lsSet("hsa_viewmode",viewMode);},[viewMode]);

  const wkk=wk(weekOffset);
  const mon=getMonday(weekOffset);
  const wkEnd=new Date(mon);wkEnd.setDate(mon.getDate()+6);
  const weekLabel=fmtDate(mon)+" - "+fmtDate(wkEnd);
  const dept=depts.find(d=>d.id===activeDeptId)||depts[0]||{id:"",label:"",icon:"🏠",color:"#3B82F6"};
  const deptEmpsAll=emps.filter(e=>e.dept===activeDeptId);
  const empFilterNorm=empFilter.trim().toLowerCase();
  const deptEmps=empFilterNorm?deptEmpsAll.filter(e=>e.name.toLowerCase().includes(empFilterNorm)):deptEmpsAll;
  const dsMap=daySlots[wkk]||{};
  const slotSize=dsMap[selDay]==="30m"?0.5:1;
  const slots=(()=>{
    const base=dsMap[selDay]==="30m"?SLOTS_30:DEFAULT_SLOTS;
    const mStart=getMorningStart(activeDeptId,wkk,selDay);
    const dEnd=getDinnerEnd(activeDeptId,wkk,selDay);
    return base.filter(h=>{
      if(h.s==="morning" && h.l<mStart) return false;
      if(h.s==="dinner"  && h.l>dEnd)   return false;
      return true;
    });
  })();

    const prevSlots=dsMap[prev]==="30m"?SLOTS_30:DEFAULT_SLOTS;
    const curSlots=dsMap[selDay]==="30m"?SLOTS_30:DEFAULT_SLOTS;

        danger:true,
        onConfirm:()=>doCopyDay(prev)

      return;

    setConfirmModal({
      title:"Copiar día anterior",
      message:"¿Copiar el horario de "+DAYS_F[prev]+" a "+DAYS_F[selDay]+" para todos los empleados de "+dept.label+"?",
      warning:"Se sobrescribirá el día actual.",
      danger:true,
      onConfirm:()=>doCopyDay(prev)
    });
  }
  function doCopyDay(prev){
    setEmps(prevEmps=>prevEmps.map(e=>{
      if(e.dept!==activeDeptId)return e;
      const week={...(e.schedules[wkk]||{})};
      const src={...(week[prev]||{})};
      week[selDay]=JSON.parse(JSON.stringify(src));
      return {...e,schedules:{...e.schedules,[wkk]:week}};
    }));
    toast("Horario de "+DAYS_F[prev]+" copiado a "+DAYS_F[selDay],"success");
  }

  function moveDept(id,dir){
    setDepts(prev=>{

      if(idx<0)return prev;
      const n=idx+dir;
      if(n<0||n>=prev.length)return prev;
      const arr=[...prev];[arr[idx],arr[n]]=[arr[n],arr[idx]];return arr;
    });
  }
  function updateSchedule(empId,wkKey,dayIdx,slotKey,code){
    setEmps(prev=>prev.map(e=>{
      if(e.id!==empId)return e;
      const week={...(e.schedules[wkKey]||{})};
      const day={...(week[dayIdx]||{})};
      if(code)day[slotKey]=code;else delete day[slotKey];
      week[dayIdx]=day;
      return {...e,schedules:{...e.schedules,[wkKey]:week}};
    }));
  }
  function applyBaja(empId,dateStart,dateEnd){
    const base=getMonday(0);
    const d1=new Date(dateStart+"T00:00:00");
    const d2=new Date(dateEnd+"T00:00:00");
    setEmps(prev=>prev.map(e=>{
      if(e.id!==empId) return e;
      const sc={...e.schedules};
      let cur=new Date(d1);
      while(cur<=d2){
        const diff=Math.round((cur.getTime()-base.getTime())/86400000);
        const wOff=Math.floor(diff/7);
        const di=((cur.getDay()-1+7)%7);
        const wKey="w"+wOff;
        const dsMap2=daySlots[wKey]||{};
        const allS=dsMap2[di]==="30m"?SLOTS_30:DEFAULT_SLOTS;
        const week={...(sc[wKey]||{})};
        const day={};
        allS.forEach(h=>{day[h.l]="BAJA";});
        week[di]=day;
        sc[wKey]=week;
        cur.setDate(cur.getDate()+1);
      }
      return {...e,schedules:sc};
    }));
  }

  function toggleDayOff(empId, dayIdx){
    // Mark/unmark every slot in the day as VAC for Sat/Sun
    const allSlots = dsMap[dayIdx]==="30m" ? SLOTS_30 : DEFAULT_SLOTS;
    const daySchedule = (emps.find(e=>e.id===empId)?.schedules[wkk]||{})[dayIdx]||{};
    const allVac = allSlots.every(h=>daySchedule[h.l]==="VAC");
    setEmps(prev=>prev.map(e=>{
      if(e.id!==empId) return e;
      const week={...(e.schedules[wkk]||{})};
      if(allVac){
        // Remove all VAC for this day
        const day={...week[dayIdx]||{}};
        allSlots.forEach(h=>{ if(day[h.l]==="VAC") delete day[h.l]; });
        week[dayIdx]=day;
      } else {
        // Set all slots to VAC
        const day={};
        allSlots.forEach(h=>{ day[h.l]="VAC"; });
        week[dayIdx]=day;
      }
      return {...e,schedules:{...e.schedules,[wkk]:week}};
    }));
  }

  function isDayOff(emp, dayIdx){
    const allSlots = dsMap[dayIdx]==="30m" ? SLOTS_30 : DEFAULT_SLOTS;
    const daySchedule = (emp.schedules[wkk]||{})[dayIdx]||{};
    return allSlots.length>0 && allSlots.every(h=>daySchedule[h.l]==="VAC");

              <button className={"segmented-btn"+(isFestivo(activeDeptId,wkk,selDay)?" active":"")}
                style={{border:"1px solid var(--border)",background:isFestivo(activeDeptId,wkk,selDay)?"#f0fdf4":"var(--surface)",color:isFestivo(activeDeptId,wkk,selDay)?"#16a34a":"var(--text-2)"}}
                onClick={()=>toggleFestivo(activeDeptId,wkk,selDay)} title="Tratar este día como festivo (como fin de semana)">
                {isFestivo(activeDeptId,wkk,selDay)?"🎉 Festivo":"🗓️ Marcar festivo"}
              </button>
              <div className="range-pill" title={"Cambia el horario de "+DAYS_F[selDay]+" en adelante, para el resto de la semana"}>
                <span style={{fontSize:10,color:"#F59E0B",fontWeight:700}}>☀</span>
                <select value={getMorningStart(activeDeptId,wkk,selDay)} onChange={e=>applyMorningStartFrom(activeDeptId,wkk,selDay,e.target.value)}>
                  {DEFAULT_SLOTS.filter(h=>h.s==="morning").map(h=><option key={h.l} value={h.l}>{h.l}</option>)}
                </select>
                <span style={{color:"var(--text-3)",fontSize:11}}>→</span>
                <span style={{fontSize:10,color:"#8B5CF6",fontWeight:700}}>☾</span>
                <select value={getDinnerEnd(activeDeptId,wkk,selDay)} onChange={e=>applyDinnerEndFrom(activeDeptId,wkk,selDay,e.target.value)}>
                  {DEFAULT_SLOTS.filter(h=>h.s==="dinner").map(h=><option key={h.l} value={h.l}>{h.l}</option>)}
                </select>
                <span style={{fontSize:9.5,color:"var(--text-3)",whiteSpace:"nowrap"}}>desde {DAYS_S[selDay]} en adelante</span>
              </div>
            </div>

            <div className="legend">
              <span className="legend-title">Leyenda</span>
              <span className="legend-chip"><span className="legend-swatch" style={{background:"#ede9fe",color:"#6d28d9"}}>✓</span>Titular</span>
              <span className="legend-chip"><span className="legend-swatch" style={{background:"#ecfeff",color:"#0891b2"}}>🏖️</span>Vacaciones / libre</span>
              <span className="legend-chip"><span className="legend-swatch" style={{background:"#fef2f2",color:"#dc2626"}}>🤒</span>Baja</span>
              {Object.entries(SHIFT_META).map(([sid,sm])=>(
                <span key={sid} className="legend-chip"><span className="legend-swatch" style={{background:sm.bg,border:"1px solid "+hex2rgba(sm.color,0.5)}}/>{sm.label}</span>
              ))}
            </div>
          </div>
          <div className="table-wrap" style={{overflow:"auto",flex:1}}>
            <div style={{transformOrigin:"top left",transform:"scale("+tableZoom+")",minWidth:(100/tableZoom)+"%"}}>
            <table>
              <thead>
                <tr className="shift-header">
                  <th style={{background:"#f8fafc",borderRight:"2px solid #e2e8f0",textAlign:"left",padding:"5px 14px",fontSize:11,color:"#94a3b8",fontWeight:500,position:"sticky",left:0}}>{dept.icon} {dept.label}</th>
                  {isWeekendLike(selDay)&&<th style={{background:"#FEF9EC",borderRight:"2px solid #F59E0B",borderBottom:"2px solid #F59E0B",color:"#92400E",padding:"0 8px",fontSize:11,fontWeight:700}}>{DAYS_S[selDay]}</th>}
                  {Object.entries(SHIFT_META).map(([sid,sm])=>{
                    const base2=dsMap[selDay]==="30m"?SLOTS_30:DEFAULT_SLOTS;
                    const allSidSlots=base2.filter(h=>h.s===sid);
                    const cols=slots.filter(h=>h.s===sid).length;
                    if(!allSidSlots.length)return null;
                    if(sid==="morning"){
                      const curStart=getMorningStart(activeDeptId,wkk,selDay);
                      return (
                        <th key={sid} colSpan={cols||1} style={{color:sm.text,background:sm.bg,borderBottom:"2px solid "+sm.color,borderRight:"1px solid "+hex2rgba(sm.color,0.4),padding:"3px 6px"}}>
                          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                            <select value={curStart} onChange={e=>setMorningStart(activeDeptId,wkk,selDay,e.target.value)}
                              style={{fontSize:10,padding:"2px 4px",borderRadius:5,border:"1px solid "+sm.color,background:"#fff",color:sm.text,cursor:"pointer",fontWeight:700,maxWidth:60}}>
                              {allSidSlots.map(h=><option key={h.l} value={h.l}>{h.l}</option>)}
                            </select>
                            <span>{sm.label}</span>
                          </div>
                        </th>
                      );
                    }
                    if(sid==="dinner"){
                      const curEnd=getDinnerEnd(activeDeptId,wkk,selDay);
                      return (
                        <th key={sid} colSpan={cols||1} style={{color:sm.text,background:sm.bg,borderBottom:"2px solid "+sm.color,borderRight:"1px solid "+hex2rgba(sm.color,0.4),padding:"3px 6px"}}>
                          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                            <span>{sm.label}</span>
                            <select value={curEnd} onChange={e=>setDinnerEnd(activeDeptId,wkk,selDay,e.target.value)}
                              style={{fontSize:10,padding:"2px 4px",borderRadius:5,border:"1px solid "+sm.color,background:"#fff",color:sm.text,cursor:"pointer",fontWeight:700,maxWidth:60}}>
                              {allSidSlots.map(h=><option key={h.l} value={h.l}>{h.l}</option>)}
                            </select>
                          </div>
                        </th>
                      );
                    }
                    return <th key={sid} colSpan={cols} style={{color:sm.text,background:sm.bg,borderBottom:"2px solid "+sm.color,borderRight:"1px solid "+hex2rgba(sm.color,0.4)}}>{sm.label}</th>;
                  })}
                </tr>
                <tr className="hour-header">
                  <th style={{background:"#f8fafc",borderRight:"2px solid #e2e8f0",textAlign:"left",padding:"4px 14px",position:"sticky",left:0}}>Nombre</th>
                  {isWeekendLike(selDay)&&<th style={{background:"#FEF9EC",color:"#92400E",borderRight:"2px solid #F59E0B",padding:"0 6px",fontSize:10,fontWeight:700,whiteSpace:"nowrap"}}>Libre</th>}
                  {slots.map((h,hi)=>{
                    const sm=SHIFT_META[h.s];
                    const isLast=hi===slots.length-1||slots[hi+1].s!==h.s;
                    return <th key={hi} style={{background:sm.bg,color:sm.text,borderRight:isLast?"2px solid "+hex2rgba(sm.color,0.4):"1px solid "+hex2rgba(sm.color,0.15)}}>{h.l}</th>;
                  })}
                </tr>
              </thead>
              <tbody>
                {deptEmps.map(emp=>{
                  const empDayH=Object.values((emp.schedules[wkk]||{})[selDay]||{}).filter(v=>v&&v.startsWith("TIT:")).length*slotSize;
                  return (
                    <tr key={emp.id} className="emp-row">
                      <td className="name-td" onClick={()=>setEmpSnap(emp)} title="Ver resumen del empleado">
                        {emp.name}
                        {empDayH>0&&<span style={{marginLeft:6,fontSize:11,color:dept.color,fontWeight:700,background:hex2rgba(dept.color,0.1),borderRadius:99,padding:"1px 6px"}}>{empDayH}h</span>}
                        {(()=>{const wh=empWeekH(emp);return wh>0?<span className="week-hours-badge" title="Total de la semana">{wh}h sem</span>:null;})()}
                      </td>
                      {isWeekendLike(selDay)&&(()=>{
                        const off=isDayOff(emp,selDay);
                        return (
                          <td style={{borderRight:"2px solid #F59E0B",padding:"0 8px",background:off?"#FEF3C7":"#fff",cursor:"pointer",textAlign:"center",verticalAlign:"middle",minWidth:52}}
                            onClick={()=>toggleDayOff(emp.id,selDay)}
                            title={off?"Quitar día libre":"Marcar día libre"}>
                            <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:1}}>
                              <span style={{fontSize:18}}>{off?"🏖️":"○"}</span>
                              <span style={{fontSize:9,fontWeight:700,color:off?"#D97706":"#cbd5e1"}}>{off?"Libre":""}</span>
                            </div>
                          </td>
                        );
                      })()}
                      {slots.map((h,hi)=>{
                        const code=(emp.schedules[wkk]||{})[selDay]?.[h.l]||null;
                        const sm=SHIFT_META[h.s];
                        const isLast=hi===slots.length-1||slots[hi+1].s!==h.s;
                        const isSelected=inlineCP&&inlineCP.empId===emp.id&&inlineCP.slotKey===h.l&&inlineCP.dayIdx===selDay&&inlineCP.wk===wkk;
                        return (
                          <td key={hi} className="cell" style={{background:code?cellStyle(code).background:sm.bg,borderRight:isLast?"2px solid "+hex2rgba(sm.color,0.4):"1px solid "+hex2rgba(sm.color,0.1),outline:isSelected?"2px solid #4f46e5":"none",outlineOffset:"-2px"}}
                            onClick={()=>{
                              const isSame=inlineCP&&inlineCP.empId===emp.id&&inlineCP.slotKey===h.l&&inlineCP.dayIdx===selDay&&inlineCP.wk===wkk;
                              if(isSame){setInlineCP(null);setNumPickerOpen(false);}
                              else{setInlineCP({empId:emp.id,wk:wkk,dayIdx:selDay,slotKey:h.l,shiftId:h.s,num:1});setNumInput("");setNumPickerOpen(true);}
                            }}>
                            <div className={"cell-inner"+(code?"":" cell-empty")} style={{color:code?cellStyle(code).color:""}}>
                              {code==="BAJA"?"🤒":code==="VAC"?"🏖️":code&&code.startsWith("TIT:")?"✓":""}
                            </div>
                          </td>
                        );
                      })}
                    </tr>
                  );
                })}
                {deptEmps.length===0&&(
                  <tr><td colSpan={slots.length+(isWeekendLike(selDay)?2:1)} style={{padding:0}}>
                    <div className="empty-state">
                      <div className="es-icon">{empFilter? "🔍" : dept.icon}</div>
                      <div className="es-text">{empFilter?('Ningún empleado coincide con "'+empFilter+'"') : ("Aún no hay empleados en "+dept.label)}</div>
                      {!empFilter&&<button className="btn btn-primary" onClick={()=>setAddEmpModal(true)}>+ Añadir el primer empleado</button>}
                      {empFilter&&<button className="btn" onClick={()=>setEmpFilter("")}>Limpiar búsqueda</button>}
                    </div>
                  </td></tr>
                )}
              </tbody>
            </table>
            </div>
          </div>
          <div className="inline-panel" style={{borderTopColor:icp?icpSm.color:"#e2e8f0"}}>
            {!icp?(
              <div style={{color:"#cbd5e1",fontSize:13,fontStyle:"italic",flex:1,textAlign:"center"}}>Haz clic en una celda para asignar turno</div>
            ):(
              <>
                <div style={{display:"flex",alignItems:"center",gap:8,minWidth:150}}>
                  <div style={{width:30,height:30,borderRadius:7,background:hex2rgba(dept.color,0.12),border:"1px solid "+hex2rgba(dept.color,0.3),display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>{dept.icon}</div>
                  <div>
                    <div style={{fontWeight:700,fontSize:13}}>{icpEmp&&icpEmp.name}</div>
                    <div style={{fontSize:11,color:"#94a3b8"}}>{DAYS_F[icp.dayIdx]} - {icp.slotKey} → {icpEndLabel(icpNum)} ({icpNum*icpSlotSize} h)</div>
                  </div>
                </div>
                <button className="numcount-btn" onClick={()=>{setNumInput("");setNumPickerOpen(true);}} title="Elegir cuántas franjas asignar">
                  <span style={{fontSize:16,fontWeight:800,color:dept.color}}>{icpNum}</span>
                  <span style={{fontSize:8,color:"var(--text-3)",fontWeight:650}}>{icpNum===1?"franja ▾":"franjas ▾"}</span>
                </button>
                <div style={{display:"flex",gap:5,flexWrap:"wrap",flex:1}}>
                  <button onClick={()=>handleAssign(icpEmp?"TIT:"+icpEmp.id:null,icpKeys)} style={{padding:"10px 16px",borderRadius:10,border:"2px solid "+(icpCur&&icpCur.startsWith("TIT:")?"#8B5CF6":"#c4b5fd"),background:icpCur&&icpCur.startsWith("TIT:")?"#ede9fe":"#f5f3ff",color:"#6d28d9",fontWeight:700,cursor:"pointer",fontSize:14,minHeight:44}}>👤 Titular</button>
                  <button onClick={()=>setBajaModal({empId:icp.empId})} style={{padding:"10px 16px",borderRadius:10,border:"2px solid "+(icpCur==="BAJA"?"#ef4444":"#fca5a5"),background:icpCur==="BAJA"?"#fef2f2":"#fff5f5",color:"#dc2626",fontWeight:700,cursor:"pointer",fontSize:14,minHeight:44}}>🤒 Baja</button>
                  <button onClick={()=>handleAssign("VAC",icpKeys)} style={{padding:"10px 16px",borderRadius:10,border:"2px solid "+(icpCur==="VAC"?"#06B6D4":"#a5f3fc"),background:icpCur==="VAC"?"#ecfeff":"#f0fffe",color:"#0891b2",fontWeight:700,cursor:"pointer",fontSize:14,minHeight:44}}>🏖️ Vacaciones</button>
                  <button onClick={()=>handleAssign(null,icpKeys)} style={{padding:"10px 16px",borderRadius:10,border:"2px solid #fca5a5",background:"#fff",color:"#ef4444",fontWeight:700,cursor:"pointer",fontSize:14,minHeight:44}}>✕ Quitar</button>
                </div>
                <button onClick={()=>setInlineCP(null)} style={{background:"none",border:"1px solid #e2e8f0",borderRadius:8,cursor:"pointer",fontSize:16,color:"#94a3b8",padding:"3px 7px"}}>X</button>
              </>
            )}
          </div>
          <div className="bottom-bar">
            <div style={{flex:1}}></div>
            <button className="btn btn-danger" onClick={()=>setConfirmModal({title:"Limpiar semana",message:"Se borrarán todos los turnos de "+weekLabel+".",warning:"Esta acción no se puede deshacer.",danger:true,onConfirm:clearWeek})}>Limpiar semana</button>
          </div>
        </div>
      </div>
      {bajaModal&&<BajaModal emp={emps.find(e=>e.id===bajaModal.empId)||{name:""}} weekOffset={weekOffset} onClose={()=>setBajaModal(null)} onApply={(s,e2)=>{applyBaja(bajaModal.empId,s,e2);setInlineCP(null);setBajaModal(null);}}/>
      }
      {numPickerOpen&&icp&&(()=>{
        const maxNum=icpSlots.length-icpSi;
        const hasInput=numInput!=="";
        const val=hasInput?parseInt(numInput,10):0;
        const valid=hasInput&&val>=1&&val<=maxNum;
        const overMax=hasInput&&val>maxNum;
        function pressDigit(d){
          setNumInput(prev=>{
            if(prev.length>=2)return prev;
            const next=prev==="0"?String(d):prev+String(d);
            return next.length>2?prev:next;
          });
        }
        function confirm(){
          if(!valid)return;
          setInlineCP(p=>({...p,num:val}));
          setNumPickerOpen(false);
        }
        return (
          <div className="overlay" onClick={()=>setNumPickerOpen(false)}>
            <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:320}}>
              <div className="modal-title" style={{marginBottom:4}}>¿Cuántas franjas?</div>
              <div style={{fontSize:13,color:"var(--text-2)",marginBottom:14}}>
                Para <strong>{icpEmp&&icpEmp.name}</strong> - {DAYS_F[icp.dayIdx]} desde las {icp.slotKey}
              </div>
              <div className="numpad-display">
                <span className={"numpad-display-val"+(hasInput?"":" placeholder")}>{hasInput?numInput:icpNum}</span>
                <span className="numpad-display-unit">{(hasInput?val:icpNum)===1?"franja":"franjas"}</span>
              </div>
              <div className="numgrid">
                {[7,8,9,4,5,6,1,2,3].map(n=>(
                  <button key={n} className="numgrid-btn" onClick={()=>pressDigit(n)}>{n}</button>
                ))}
                <button className="numgrid-btn fn clear" onClick={()=>setNumInput("")}>C</button>
                <button className="numgrid-btn" onClick={()=>pressDigit(0)}>0</button>
                <button className="numgrid-btn fn" onClick={()=>setNumInput(prev=>prev.slice(0,-1))}>⌫</button>
              </div>
              <div style={{fontSize:11.5,color:overMax?"var(--danger)":"var(--text-3)",textAlign:"center",marginBottom:12,fontWeight:overMax?700:400}}>
                {overMax
                  ?("Solo hay "+maxNum+" franjas disponibles desde las "+icp.slotKey)
                  :("Disponibles hasta el final del día: "+maxNum+(hasInput&&val>=1?" · hasta las "+icpEndLabel(val):""))}
              </div>
              <button className="btn btn-primary" style={{width:"100%",justifyContent:"center",opacity:valid?1:0.45}} disabled={!valid} onClick={confirm}>
                ✓ Usar {hasInput?val:icpNum} {(hasInput?val:icpNum)===1?"franja":"franjas"}
              </button>
            </div>
          </div>
        );
      })()}
      {templatesOpen&&<TemplatesModal dept={dept} weekOffset={weekOffset} weekLabel={weekLabel} slots={getTemplateSlots(activeDeptId)}
        onSave={(idx,name)=>saveTemplate(activeDeptId,idx,name)}
        onRename={(idx,name)=>renameTemplate(activeDeptId,idx,name)}
        onDelete={(idx)=>deleteTemplate(activeDeptId,idx)}
        onApply={(idx,offsets)=>applyTemplate(activeDeptId,idx,offsets)}
        onClear={(offsets)=>clearWeeksForDept(activeDeptId,offsets)}
        onClose={()=>setTemplatesOpen(false)}/>}
      {weekSnap&&<WeekSnapshotModal dept={dept} deptEmps={deptEmps} weekOffset={weekOffset} slots={slots} daySlots={daySlots} festivos={festivos} activeDeptId={activeDeptId} onClose={()=>setWeekSnap(false)}/>}
      {deptMonthSnap&&<DeptMonthModal dept={dept} deptEmps={deptEmps} weekOffset={weekOffset} daySlots={daySlots} festivos={festivos} activeDeptId={activeDeptId} onClose={()=>setDeptMonthSnap(false)}/>}
      {daysOffHistory&&<DaysOffHistoryModal dept={dept} deptEmps={deptEmps} daySlots={daySlots} festivos={festivos} activeDeptId={activeDeptId} onClose={()=>setDaysOffHistory(false)}/>}
      {empSnap&&<EmpSnapshotModal emp={empSnap} dept={dept} weekOffset={weekOffset} daySlots={daySlots} onClose={()=>setEmpSnap(null)}/>}
      {addEmpModal&&<AddEmpModal dept={dept} onClose={()=>setAddEmpModal(false)} onAdd={addEmployee}/>}
      {deptFormModal&&<DeptFormModal dept={deptFormModal.dept} isNew={deptFormModal.isNew} onClose={()=>setDeptFormModal(null)} onSave={saveDept} emps={emps} onAddEmp={name=>{setEmps(prev=>[...prev,{id:Date.now(),name,dept:deptFormModal.dept&&deptFormModal.dept.id,schedules:{}}]);}} onDelEmp={id=>setEmps(prev=>prev.filter(e=>e.id!==id))} onRenEmp={(id,name)=>setEmps(prev=>prev.map(e=>e.id===id?{...e,name}:e))}/>}
      {confirmModal&&<ConfirmModal {...confirmModal} onClose={()=>setConfirmModal(null)}/>}
      {settingsOpen&&<SettingsModal appFont={appFont} appFontSize={appFontSize} appBg={appBg} viewMode={viewMode} onSave={(f,s,b,vm)=>{setAppFont(f);setAppFontSize(s);setAppBg(b);setViewMode(vm);setSettingsOpen(false);}} onClose={()=>setSettingsOpen(false)}/>}

      {titleEdit&&(
        <div className="overlay" onClick={()=>setTitleEdit(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:360}}>
            <div className="modal-title">Editar título</div>
            <label className="form-label">Nombre de la app</label>
            <input className="form-input" value={appTitle} onChange={e=>setAppTitle(e.target.value)} autoFocus/>
            <div className="modal-footer">
              <button className="btn" onClick={()=>setTitleEdit(false)}>Cancelar</button>
              <button className="btn btn-primary" onClick={()=>setTitleEdit(false)}>Guardar</button>
            </div>
          </div>
        </div>
      )}
      <ToastHost toasts={toasts} onDismiss={dismissToast}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</body>
</html>
